<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>资产台账 - 网络安全运维管理平台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/asset-security.css">
</head>
<body class="as-page" data-menu-key="asset.ledger" data-page-section="资产安全管理" data-page-title="资产台账">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="metric-grid" id="asLedgerMetrics">
          <article class="metric-card"><div class="metric-label">资产总数</div><div class="metric-number" data-m="total">0</div></article>
          <article class="metric-card"><div class="metric-label">影子资产</div><div class="metric-number" data-m="shadow">0</div></article>
          <article class="metric-card"><div class="metric-label">责任人缺失</div><div class="metric-number" data-m="missingOwner">0</div></article>
          <article class="metric-card"><div class="metric-label">配置不一致</div><div class="metric-number" data-m="inconsistent">0</div></article>
        </section>

        <section class="card filters">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">名称/标识</span>
              <input class="form-control" data-filter="keyword" placeholder="请输入">
            </label>
            <label class="form-field"><span class="form-label">责任人</span>
              <input class="form-control" data-filter="owner" placeholder="请输入">
            </label>
            <label class="form-field"><span class="form-label">部门</span>
              <input class="form-control" data-filter="dept" placeholder="请输入">
            </label>
            <label class="form-field"><span class="form-label">发现来源</span>
              <select class="form-control" data-filter="source">
                <option value="">全部</option>
                <option value="auto">自动发现</option>
                <option value="manual">手工登记</option>
              </select>
            </label>
            <label class="form-field"><span class="form-label">状态</span>
              <select class="form-control" data-filter="status">
                <option value="">全部</option>
                <option value="normal">正常</option>
                <option value="shadow">影子资产</option>
                <option value="inconsistent">配置不一致</option>
                <option value="offline">离线</option>
              </select>
            </label>
            <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-action="search">搜索</button>
          </div>
        </section>

        <section class="card user-list-card">
          <div class="card-title-row user-toolbar">
            <h2 class="card-title">资产列表</h2>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button>
              <button class="btn btn-secondary" type="button" data-action="import"><i class="fa-solid fa-upload"></i> 导入</button>
              <button class="btn btn-secondary" type="button" data-action="discover"><i class="fa-solid fa-satellite-dish"></i> 资产发现</button>
              <button class="btn btn-primary" type="button" data-action="create"><i class="fa-solid fa-plus"></i> 新增</button>
            </div>
          </div>
          <div class="tabs as-tabs-scroll" role="tablist" id="asTypeTabs"></div>
          <div class="table-wrap">
            <table class="table user-table table-actions-sticky">
              <thead>
                <tr>
                  <th>名称</th><th>类型</th><th>标识</th><th>责任人</th><th>部门</th>
                  <th>发现来源</th><th>状态</th><th>最近发现时间</th><th class="user-actions-col">操作</th>
                </tr>
              </thead>
              <tbody id="asLedgerBody"></tbody>
            </table>
          </div>
          <div class="pagination" id="asLedgerPager"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="../../../app/config/menu.js"></script>
  <script src="../../../app/components/sidebar.js"></script>
  <script src="../../../app/components/header.js"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/data/asset-security-mock.js"></script>
  <script>
    const AS = window.AssetSecurity;
    const esc = (v) => String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const dash = (v) => (v == null || v === "" ? "-" : esc(v));
    let currentType = "";
    let filtered = [];
    let currentPage = 1;
    const pageSize = 10;
    const urlAssetId = new URLSearchParams(location.search).get("assetId") || "";

    function tagHtml(meta) {
      if (!meta || !meta.label) return "-";
      const cls = meta.tagClass ? `tag ${meta.tagClass}` : "tag";
      return `<span class="${cls}">${esc(meta.label)}</span>`;
    }

    function infoItem(label, value) {
      return `<div class="info-item"><span class="info-label">${label}</span><span class="info-value">${value}</span></div>`;
    }

    function refreshMetrics() {
      const m = AS.ledgerMetrics();
      document.querySelectorAll("#asLedgerMetrics [data-m]").forEach((el) => {
        el.textContent = m[el.dataset.m] ?? 0;
      });
    }

    function renderTypeTabs() {
      const tabs = [{ key: "", label: "全部" }].concat(AS.TYPE_ORDER.map((k) => ({ key: k, label: AS.TYPE_LABEL[k] })));
      document.getElementById("asTypeTabs").innerHTML = tabs.map((t) =>
        `<button class="tab${t.key === currentType ? " active" : ""}" type="button" role="tab" data-type="${esc(t.key)}">${esc(t.label)}</button>`
      ).join("");
    }

    function readFilter() {
      return Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((el) => [el.dataset.filter, el.value.trim()]));
    }

    function renderPager(total) {
      const pages = Math.max(1, Math.ceil(total / pageSize));
      currentPage = Math.min(currentPage, pages);
      let html = `<span>共 <strong>${total}</strong> 条记录，每页 10 条</span>`;
      html += `<span class="page-item${currentPage === 1 ? " disabled" : ""}" data-page-action="prev">‹</span>`;
      for (let i = 1; i <= pages; i += 1) {
        html += `<span class="page-item${i === currentPage ? " active" : ""}" data-page-number="${i}">${i}</span>`;
      }
      html += `<span class="page-item${currentPage === pages ? " disabled" : ""}" data-page-action="next">›</span>`;
      document.getElementById("asLedgerPager").innerHTML = html;
    }

    function render() {
      const f = readFilter();
      filtered = AS.listAssets({
        type: currentType || undefined,
        keyword: f.keyword || undefined,
        owner: f.owner || undefined,
        dept: f.dept || undefined,
        source: f.source || undefined,
        status: f.status || undefined,
      });
      renderPager(filtered.length);
      const pageRows = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      document.getElementById("asLedgerBody").innerHTML = pageRows.map((row) => `<tr data-id="${esc(row.id)}">
        <td>${dash(row.name)}</td>
        <td>${esc(AS.typeLabel(row.type))}</td>
        <td>${dash(row.identity)}</td>
        <td>${dash(row.owner)}</td>
        <td>${dash(row.dept)}</td>
        <td>${esc(AS.sourceLabel(row.source))}</td>
        <td>${tagHtml(AS.statusMeta(row.status))}</td>
        <td>${dash(row.discoveredAt)}</td>
        <td class="user-actions-col">
          <button class="table-action" type="button" data-row="detail" data-id="${esc(row.id)}">详情</button>
          <button class="table-action" type="button" data-row="edit" data-id="${esc(row.id)}">编辑</button>
          <button class="table-action" type="button" data-row="owner" data-id="${esc(row.id)}">指定责任人</button>
        </td>
      </tr>`).join("") || `<tr><td colspan="9" style="text-align:center;color:var(--text-secondary)">暂无数据</td></tr>`;
      refreshMetrics();
    }

    function openDetail(id) {
      const row = AS.getAsset(id);
      if (!row) return;
      const extraItems = Object.entries(row.extra || {}).map(([k, v]) => infoItem(k, dash(v))).join("");
      const body = `
        <section class="detail-section">
          <h3 class="detail-title">基础信息</h3>
          <div class="detail-grid user-detail-grid">
            ${infoItem("资产名称", dash(row.name))}
            ${infoItem("资产类型", esc(AS.typeLabel(row.type)))}
            ${infoItem("标识", dash(row.identity))}
            ${infoItem("责任人", dash(row.owner))}
            ${infoItem("部门", dash(row.dept))}
            ${infoItem("发现来源", esc(AS.sourceLabel(row.source)))}
            ${infoItem("状态", tagHtml(AS.statusMeta(row.status)))}
            ${infoItem("敏感度", esc((AS.GRADE_META[row.sensitivity] || {}).label || row.sensitivity || "-"))}
            ${infoItem("最近发现", dash(row.discoveredAt))}
            ${infoItem("配置摘要", dash(row.configSummary))}
            ${infoItem("访问关系", dash((row.accessLinks || []).map((l) => l.name).join("、")))}
            ${infoItem("标签", dash((row.tags || []).join("、")))}
            ${extraItems}
            ${infoItem("备注信息", "-")}
          </div>
        </section>
        <div class="as-detail-links">
          <a class="btn btn-secondary" href="vuln.html?assetId=${encodeURIComponent(row.id)}">查看脆弱性</a>
          <a class="btn btn-secondary" href="risk.html?assetId=${encodeURIComponent(row.id)}">风险画像</a>
        </div>`;
      window.openAppDrawer({ title: "资产详情", body, footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button>' });
    }

    function typeOptions(selected) {
      return AS.TYPE_ORDER.map((k) => `<option value="${k}"${k === selected ? " selected" : ""}>${esc(AS.TYPE_LABEL[k])}</option>`).join("");
    }

    function openForm(mode, id) {
      const row = mode === "edit" ? AS.getAsset(id) : null;
      const body = `
        <label class="form-field form-item"><span class="form-label form-required">资产名称</span><input class="form-control" id="asName" value="${esc(row?.name || "")}" placeholder="请输入"></label>
        <label class="form-field form-item"><span class="form-label form-required">资产类型</span><select class="form-control" id="asType">${typeOptions(row?.type || "server")}</select></label>
        <label class="form-field form-item"><span class="form-label">标识</span><input class="form-control" id="asIdentity" value="${esc(row?.identity || "")}" placeholder="IP / URL / 实例名"></label>
        <label class="form-field form-item"><span class="form-label">责任人</span><input class="form-control" id="asOwner" value="${esc(row?.owner || "")}" placeholder="请输入"></label>
        <label class="form-field form-item"><span class="form-label">部门</span><input class="form-control" id="asDept" value="${esc(row?.dept || "")}" placeholder="请输入"></label>
        <label class="form-field form-item"><span class="form-label">发现来源</span>
          <select class="form-control" id="asSource">
            <option value="manual"${(row?.source || "manual") === "manual" ? " selected" : ""}>手工登记</option>
            <option value="auto"${row?.source === "auto" ? " selected" : ""}>自动发现</option>
          </select>
        </label>
        <label class="form-field form-item"><span class="form-label">状态</span>
          <select class="form-control" id="asStatus">
            ${["normal","shadow","inconsistent","offline"].map((s) => `<option value="${s}"${(row?.status || "normal") === s ? " selected" : ""}>${esc(AS.statusMeta(s).label)}</option>`).join("")}
          </select>
        </label>
        <label class="form-field form-item"><span class="form-label">敏感度</span>
          <select class="form-control" id="asSens">
            ${["high","medium","low"].map((s) => `<option value="${s}"${(row?.sensitivity || "medium") === s ? " selected" : ""}>${esc((AS.GRADE_META[s] || {}).label || s)}</option>`).join("")}
          </select>
        </label>
        <label class="form-field form-item"><span class="form-label">配置摘要</span><textarea class="form-control textarea" id="asConfig" placeholder="请输入">${esc(row?.configSummary || "")}</textarea></label>`;
      window.openAppDrawer({
        title: mode === "edit" ? "编辑资产" : "新增资产",
        body,
        footer: `<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-drawer-submit="save" data-id="${esc(row?.id || "")}">确认</button>`,
      });
    }

    function openOwner(id) {
      const row = AS.getAsset(id);
      if (!row) return;
      const body = `<label class="form-field form-item"><span class="form-label form-required">责任人</span><input class="form-control" id="asOwnerOnly" value="${esc(row.owner || "")}" placeholder="请输入"></label>`;
      window.openAppDrawer({
        title: "指定责任人",
        body,
        footer: `<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-drawer-submit="owner" data-id="${esc(id)}">确认</button>`,
      });
    }

    function openDiscover() {
      AS.runDiscovery();
      const list = AS.listDiscoverCandidates();
      const rows = list.map((c) => `<label class="switch-line form-item" style="display:flex;gap:8px;align-items:flex-start">
        <input type="checkbox" data-candidate="${esc(c.id)}" checked>
        <span><strong>${esc(c.name)}</strong>（${esc(AS.typeLabel(c.type))} · ${esc(c.identity)}）<br><small style="color:var(--text-secondary)">${esc(c.reason)}</small></span>
      </label>`).join("") || `<p class="helper-text">暂无待确认资产</p>`;
      window.openAppDrawer({
        title: "资产发现",
        body: `<p class="helper-text" style="margin-bottom:12px">勾选后确认入库；无责任人将标记为影子资产。</p>${rows}`,
        footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-drawer-submit="discover">确认入库</button>',
      });
    }

    renderTypeTabs();
    render();
    if (urlAssetId && AS.getAsset(urlAssetId)) openDetail(urlAssetId);

    document.addEventListener("click", (event) => {
      const typeTab = event.target.closest("#asTypeTabs [data-type]");
      if (typeTab) {
        currentType = typeTab.dataset.type;
        renderTypeTabs();
        currentPage = 1;
        render();
        return;
      }

      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "search") { currentPage = 1; render(); }
      if (action === "reset") {
        document.querySelectorAll("[data-filter]").forEach((el) => { el.value = ""; });
        currentPage = 1;
        render();
      }
      if (action === "export") alert("已导出（演示，不会生成真实文件）");
      if (action === "import") alert("请选择文件（演示，不会解析真实文件）");
      if (action === "create") openForm("create");
      if (action === "discover") openDiscover();

      const rowBtn = event.target.closest("[data-row]");
      if (rowBtn) {
        const id = rowBtn.dataset.id;
        if (rowBtn.dataset.row === "detail") openDetail(id);
        if (rowBtn.dataset.row === "edit") openForm("edit", id);
        if (rowBtn.dataset.row === "owner") openOwner(id);
      }

      const pageNum = event.target.closest("[data-page-number]");
      if (pageNum) { currentPage = Number(pageNum.dataset.pageNumber); render(); }
      const pageAct = event.target.closest("[data-page-action]")?.dataset.pageAction;
      if (pageAct === "prev" && currentPage > 1) { currentPage -= 1; render(); }
      if (pageAct === "next") {
        const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (currentPage < pages) { currentPage += 1; render(); }
      }

      const submit = event.target.closest("[data-drawer-submit]");
      if (!submit) return;
      if (submit.dataset.drawerSubmit === "save") {
        const name = document.getElementById("asName")?.value.trim();
        if (!name) { alert("请填写资产名称"); return; }
        AS.saveAsset({
          id: submit.dataset.id || undefined,
          name,
          type: document.getElementById("asType").value,
          identity: document.getElementById("asIdentity").value.trim(),
          owner: document.getElementById("asOwner").value.trim(),
          dept: document.getElementById("asDept").value.trim(),
          source: document.getElementById("asSource").value,
          status: document.getElementById("asStatus").value,
          sensitivity: document.getElementById("asSens").value,
          configSummary: document.getElementById("asConfig").value.trim(),
        });
        window.closeAppDrawer();
        currentPage = 1;
        render();
      }
      if (submit.dataset.drawerSubmit === "owner") {
        const owner = document.getElementById("asOwnerOnly")?.value.trim();
        if (!owner) { alert("请填写责任人"); return; }
        AS.assignOwner(submit.dataset.id, owner);
        window.closeAppDrawer();
        render();
      }
      if (submit.dataset.drawerSubmit === "discover") {
        const ids = [...document.querySelectorAll("[data-candidate]:checked")].map((el) => el.dataset.candidate);
        if (!ids.length) { alert("请至少勾选一项"); return; }
        AS.confirmDiscovery(ids);
        window.closeAppDrawer();
        currentPage = 1;
        render();
      }
    });
  </script>
</body>
</html>
