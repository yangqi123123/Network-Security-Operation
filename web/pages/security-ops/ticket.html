<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安全工单管理 - 网络安全运维管理平台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/alarm-center.css">
  <link rel="stylesheet" href="../../assets/css/security-ops.css">
  <link rel="stylesheet" href="../../assets/css/person-picker.css">
</head>
<body class="secops-page ticket-page list-workbench" data-menu-key="secops.ticket" data-page-section="安全运营管理" data-page-title="安全工单管理">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="card filters">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">关键字</span><input class="form-control" data-filter="keyword" placeholder="工单号/标题/资产"></label>
            <label class="form-field"><span class="form-label">状态</span><select class="form-control" data-filter="status"><option value="">全部</option></select></label>
            <label class="form-field"><span class="form-label">优先级</span><select class="form-control" data-filter="priority"><option value="">全部</option></select></label>
            <label class="form-field"><span class="form-label">类型</span><select class="form-control" data-filter="type"><option value="">全部</option></select></label>
            <label class="form-field"><span class="form-label">处理人</span>
              <button class="pp-trigger" type="button" data-open-picker="filter" data-picker-mode="single" id="filterHandlerTrigger">
                <span data-picker-display="filter"><span class="alarm-tag-placeholder">请选择处理人</span></span>
                <i class="fa-solid fa-chevron-down"></i>
              </button>
              <input type="hidden" data-filter="handler" id="filterHandler" value="">
            </label>
            <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-action="search">搜索</button>
          </div>
        </section>

        <section class="card user-list-card">
          <div class="card-title-row user-toolbar">
            <h2 class="card-title">工单列表</h2>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-action="auto"><i class="fa-solid fa-bolt"></i> 自动派单</button>
              <button class="btn btn-primary" type="button" data-action="create"><i class="fa-solid fa-plus"></i> 手工派单</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table user-table table-actions-sticky">
              <thead>
                <tr>
                  <th>工单号</th><th>标题</th><th>类型</th><th>关联对象</th><th>优先级</th><th>处理人</th><th>超时</th><th>状态</th><th>创建时间</th><th class="user-actions-col">操作</th>
                </tr>
              </thead>
              <tbody id="tkBody"></tbody>
            </table>
          </div>
          <div class="pagination" id="tkPager"></div>
        </section>
      </div>
    </main>
  </div>

  <div class="pp-mask" id="personPickerMask" aria-hidden="true">
    <div class="pp-dialog" role="dialog" aria-modal="true" aria-labelledby="ppTitle">
      <div class="pp-header">
        <h3 id="ppTitle">选择人员</h3>
        <button class="pp-close" type="button" data-pp-close aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="pp-body">
        <aside class="pp-col">
          <div class="pp-col-head">
            <div class="pp-col-title">组织架构</div>
            <div class="pp-dept-search">
              <input class="form-control" id="ppDeptKeyword" placeholder="搜索部门">
            </div>
          </div>
          <div class="pp-col-scroll" id="ppDeptTree"></div>
        </aside>
        <section class="pp-col">
          <div class="pp-col-head">
            <div class="pp-people-search">
              <input class="form-control" id="ppPeopleKeyword" placeholder="请输入">
              <button class="btn btn-primary" type="button" data-pp-search style="height:32px;padding:0 12px">搜索</button>
              <button class="btn btn-secondary" type="button" data-pp-reset style="height:32px;padding:0 12px">重置</button>
            </div>
          </div>
          <div class="pp-col-scroll" id="ppPeopleList"></div>
        </section>
        <aside class="pp-col">
          <div class="pp-col-head">
            <div class="pp-col-title">已选中人员 <button class="pp-clear" type="button" data-pp-clear>清空选中</button></div>
          </div>
          <div class="pp-col-scroll" id="ppSelectedList"></div>
        </aside>
      </div>
      <div class="pp-footer">
        <button class="btn btn-secondary" type="button" data-pp-close>取消</button>
        <button class="btn btn-primary" type="button" data-pp-confirm>确定</button>
      </div>
    </div>
  </div>

  <script src="../../../app/config/menu.js"></script>
  <script src="../../../app/components/sidebar.js"></script>
  <script src="../../../app/components/header.js"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/data/secops-mock.js"></script>
  <script>
    const S = window.SecOps;
    const esc = (v) => String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const dash = (v) => (v == null || v === "" || v === "-" ? "-" : esc(v));
    let filtered = [];
    let currentPage = 1;
    const pageSize = 10;
    let handlerKeySeq = 0;
    const pickerState = {
      targetKey: null,
      mode: "multi",
      deptId: "all",
      deptKeyword: "",
      peopleKeyword: "",
      selected: [],
      draft: [],
    };

    function tagHtml(kind, value) {
      const t = S.tagOf(kind, value);
      const cls = t.tagClass ? `tag ${t.tagClass}` : "tag";
      return `<span class="${cls}">${esc(t.label)}</span>`;
    }

    function fillSelect(key, list) {
      const el = document.querySelector(`[data-filter="${key}"]`);
      if (!el || el.tagName === "INPUT") return;
      el.innerHTML = '<option value="">全部</option>' + list.map((x) => `<option value="${esc(x)}">${esc(x)}</option>`).join("");
    }

    function relatedText(row) {
      const parts = [row.asset, row.vuln, row.alarm].filter((x) => x && x !== "-");
      return parts.length ? parts.join(" / ") : "-";
    }

    function readFilter() {
      return Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((el) => [el.dataset.filter, el.value.trim()]));
    }

    function renderPager(total) {
      const pages = Math.max(1, Math.ceil(total / pageSize));
      currentPage = Math.min(currentPage, pages);
      let html = `<span>共 <strong>${total}</strong> 条记录，每页 10 条</span>`;
      html += `<span class="page-item${currentPage === 1 ? " disabled" : ""}" data-page-action="prev">‹</span>`;
      for (let i = 1; i <= pages; i += 1) html += `<span class="page-item${i === currentPage ? " active" : ""}" data-page-number="${i}">${i}</span>`;
      html += `<span class="page-item${currentPage === pages ? " disabled" : ""}" data-page-action="next">›</span>`;
      document.getElementById("tkPager").innerHTML = html;
    }

    function rowActions(row) {
      const btns = [`<button class="table-action" type="button" data-row="detail" data-id="${esc(row.id)}">详情</button>`];
      if (row.status === "待派单") btns.push(`<button class="table-action" type="button" data-row="dispatch" data-id="${esc(row.id)}">派单</button>`);
      if (["处理中", "已转派", "已升级", "待派单"].includes(row.status)) btns.push(`<button class="table-action" type="button" data-row="transfer" data-id="${esc(row.id)}">转派</button>`);
      if (["处理中", "已转派"].includes(row.status)) {
        btns.push(`<button class="table-action" type="button" data-row="collab" data-id="${esc(row.id)}">协同</button>`);
        btns.push(`<button class="table-action" type="button" data-row="escalate" data-id="${esc(row.id)}">催办升级</button>`);
        btns.push(`<button class="table-action" type="button" data-row="review" data-id="${esc(row.id)}">复核</button>`);
      }
      if (row.status === "待复核") btns.push(`<button class="table-action" type="button" data-row="close" data-id="${esc(row.id)}">关闭评价</button>`);
      return btns.join("");
    }

    function render() {
      const f = readFilter();
      filtered = S.listTickets({
        keyword: f.keyword || undefined,
        status: f.status || undefined,
        priority: f.priority || undefined,
        type: f.type || undefined,
        handler: f.handler || undefined,
      });
      renderPager(filtered.length);
      const rows = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      document.getElementById("tkBody").innerHTML = rows.map((row) => `<tr>
        <td>${dash(row.no)}</td>
        <td>${dash(row.title)}</td>
        <td>${dash(row.type)}</td>
        <td>${dash(relatedText(row))}</td>
        <td>${tagHtml("priority", row.priority)}</td>
        <td>${dash(row.handler)}</td>
        <td>${row.overdue ? '<span class="tag danger">是</span>' : '<span class="tag success">否</span>'}</td>
        <td>${tagHtml("ticketStatus", row.status)}</td>
        <td>${dash(row.createdAt)}</td>
        <td class="user-actions-col">${rowActions(row)}</td>
      </tr>`).join("") || `<tr><td colspan="10" style="text-align:center;color:var(--text-secondary)">暂无数据</td></tr>`;
    }

    function infoItem(label, value) {
      return `<div class="info-item"><span class="info-label">${label}</span><span class="info-value">${value}</span></div>`;
    }

    function renderHistoryTimeline(history) {
      const list = Array.isArray(history) ? [...history] : [];
      list.sort((a, b) => String(b.time || "").localeCompare(String(a.time || "")));
      if (!list.length) return `<p class="alarm-detail-empty">暂无处理记录</p>`;
      return `<ol class="alarm-history-timeline">${list.map((h) => `
        <li class="alarm-history-item">
          <span class="alarm-history-dot" aria-hidden="true"></span>
          <div class="alarm-history-body">
            <time class="alarm-history-time">${dash(h.time)}</time>
            <p class="alarm-history-text"><strong>${dash(h.operator)}</strong> ${dash(h.action)}</p>
          </div>
        </li>`).join("")}</ol>`;
    }

    function openDetail(id) {
      const row = S.getTicket(id);
      if (!row) return;
      const related = (row.related || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li>-</li>";
      const files = (row.attachments || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li>-</li>";
      const body = `
        <div class="alarm-detail-tabs">
          <button class="alarm-detail-tab active" type="button" data-detail-tab="info">工单信息</button>
          <button class="alarm-detail-tab" type="button" data-detail-tab="records">处理记录</button>
        </div>
        <div data-detail-pane="info">
          <section class="detail-section">
            <h3 class="detail-title">基础信息</h3>
            <div class="detail-grid user-detail-grid">
              ${infoItem("工单号", dash(row.no))}
              ${infoItem("标题", dash(row.title))}
              ${infoItem("类型", dash(row.type))}
              ${infoItem("优先级", tagHtml("priority", row.priority))}
              ${infoItem("状态", tagHtml("ticketStatus", row.status))}
              ${infoItem("处理人", dash(row.handler))}
              ${infoItem("是否超时", row.overdue ? '<span class="tag danger">是</span>' : '<span class="tag success">否</span>')}
              ${infoItem("关联资产", dash(row.asset))}
              ${infoItem("关联漏洞", dash(row.vuln))}
              ${infoItem("关联告警", dash(row.alarm))}
              ${infoItem("创建时间", dash(row.createdAt))}
              ${infoItem("满意度", row.satisfaction == null ? "-" : esc(row.satisfaction) + " 星")}
              ${infoItem("复测结果", dash(row.retest))}
              ${infoItem("备注信息", "-")}
            </div>
          </section>
          <section class="detail-section">
            <h3 class="detail-title">关联对象</h3>
            <ul>${related}</ul>
            <h3 class="detail-title">证据附件</h3>
            <ul>${files}</ul>
          </section>
        </div>
        <div class="hidden" data-detail-pane="records">
          <section class="detail-section">
            <h3 class="detail-title">处理记录</h3>
            ${renderHistoryTimeline(row.history)}
          </section>
        </div>`;
      window.openAppDrawer({ title: "工单详情", body, footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button>' });
    }

    /* ---------- 选人弹窗 ---------- */
    function avatarText(name) {
      return String(name || "?").slice(-2);
    }

    function renderPickerDisplay(names) {
      if (!names || !names.length) return `<span class="alarm-tag-placeholder">请选择处理人</span>`;
      return names.map((name) => `<span class="alarm-selection-tag">${esc(name)}</span>`).join("");
    }

    function syncPickerTrigger(key) {
      const display = document.querySelector(`[data-picker-display="${key}"]`);
      const hidden = document.querySelector(`[data-picker-value="${key}"]`) || (key === "filter" ? document.getElementById("filterHandler") : null);
      if (!display) return;
      const names = key === "filter"
        ? (hidden?.value ? [hidden.value] : [])
        : readHandlerSelected(key);
      display.innerHTML = renderPickerDisplay(names);
      if (hidden && key !== "filter") hidden.value = names.join(",");
    }

    function openPersonPicker(targetKey, mode, initialNames) {
      pickerState.targetKey = targetKey;
      pickerState.mode = mode === "single" ? "single" : "multi";
      pickerState.deptId = "all";
      pickerState.deptKeyword = "";
      pickerState.peopleKeyword = "";
      pickerState.selected = Array.isArray(initialNames) ? initialNames.slice() : [];
      pickerState.draft = pickerState.selected.slice();
      document.getElementById("ppDeptKeyword").value = "";
      document.getElementById("ppPeopleKeyword").value = "";
      document.getElementById("personPickerMask").classList.add("open");
      document.getElementById("personPickerMask").setAttribute("aria-hidden", "false");
      renderPersonPicker();
    }

    function closePersonPicker() {
      document.getElementById("personPickerMask").classList.remove("open");
      document.getElementById("personPickerMask").setAttribute("aria-hidden", "true");
      pickerState.targetKey = null;
    }

    function renderPersonPicker() {
      const depts = S.listOrgDepts().filter((d) => !pickerState.deptKeyword || d.name.includes(pickerState.deptKeyword));
      document.getElementById("ppDeptTree").innerHTML = depts.map((d) => {
        const level = d.id === "all" || d.parent == null ? 0 : 1;
        return `<button class="pp-tree-item ${pickerState.deptId === d.id ? "active" : ""}" type="button" data-pp-dept="${esc(d.id)}" data-level="${level}">
          <span>${esc(d.name)}</span><span class="pp-count">${d.count}</span>
        </button>`;
      }).join("");

      const people = S.listOrgPeople({ deptId: pickerState.deptId, keyword: pickerState.peopleKeyword });
      document.getElementById("ppPeopleList").innerHTML = people.length
        ? people.map((p) => {
            const on = pickerState.draft.includes(p.name);
            return `<button class="pp-person-item ${on ? "selected" : ""}" type="button" data-pp-person="${esc(p.name)}">
              <span class="pp-check" aria-hidden="true"></span>
              <span class="pp-avatar" style="background:${esc(p.color)}">${esc(avatarText(p.name))}</span>
              <span><div class="pp-person-name">${esc(p.name)}</div><div class="pp-person-phone">${esc(p.phone)} · ${esc(p.deptName)}</div></span>
            </button>`;
          }).join("")
        : `<div class="pp-empty">暂无人员</div>`;

      document.getElementById("ppSelectedList").innerHTML = pickerState.draft.length
        ? `<table class="pp-selected-table"><thead><tr><th>昵称</th><th>操作</th></tr></thead><tbody>
            ${pickerState.draft.map((name) => `<tr><td>${esc(name)}</td><td><button class="table-action status-danger" type="button" data-pp-remove="${esc(name)}">移除</button></td></tr>`).join("")}
          </tbody></table>`
        : `<div class="pp-empty">暂无选中人员</div>`;
    }

    function confirmPersonPicker() {
      const key = pickerState.targetKey;
      const names = pickerState.draft.slice();
      if (!key) { closePersonPicker(); return; }
      if (pickerState.mode === "single" && names.length > 1) {
        alert("当前仅支持选择一名处理人");
        return;
      }
      if (key === "filter") {
        document.getElementById("filterHandler").value = names[0] || "";
        syncPickerTrigger("filter");
      } else {
        setHandlerSelected(key, names);
      }
      closePersonPicker();
    }

    function nextHandlerKey() {
      handlerKeySeq += 1;
      return `rule-${handlerKeySeq}`;
    }

    function ruleHandlers(rule) {
      if (Array.isArray(rule?.handlers)) return rule.handlers.slice();
      if (rule?.handler) return String(rule.handler).split(/[,，、]/).map((s) => s.trim()).filter(Boolean);
      return [];
    }

    function handlerTriggerHtml(key, selected, mode) {
      const sel = Array.isArray(selected) ? selected : [];
      return `<button class="pp-trigger" type="button" data-open-picker="${esc(key)}" data-picker-mode="${esc(mode || "multi")}">
        <span data-picker-display="${esc(key)}">${renderPickerDisplay(sel)}</span>
        <i class="fa-solid fa-chevron-down"></i>
      </button>
      <input type="hidden" data-picker-value="${esc(key)}" value="${esc(sel.join(","))}">`;
    }

    function readHandlerSelected(key) {
      const hidden = document.querySelector(`[data-picker-value="${key}"]`);
      if (!hidden) return [];
      return hidden.value ? hidden.value.split(",").filter(Boolean) : [];
    }

    function setHandlerSelected(key, list) {
      const hidden = document.querySelector(`[data-picker-value="${key}"]`);
      if (hidden) hidden.value = list.join(",");
      syncPickerTrigger(key);
    }

    function ruleMatchOptions(matchBy) {
      const options = matchBy === "type" ? S.meta.ticketTypes : S.meta.priorities;
      return options.map((x) => `<option value="${esc(x)}">${esc(x)}</option>`).join("");
    }

    function ruleRowHtml(matchBy, rule, key) {
      const options = matchBy === "type" ? S.meta.ticketTypes : S.meta.priorities;
      const selected = ruleHandlers(rule);
      return `<tr data-rule-row data-handler-key="${esc(key)}">
        <td><select class="form-control" data-rule-match>${options.map((x) => `<option value="${esc(x)}" ${x === rule?.match ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></td>
        <td>${handlerTriggerHtml(key, selected, "multi")}</td>
        <td style="text-align:center"><input type="checkbox" data-rule-enabled ${rule?.enabled !== false ? "checked" : ""}></td>
        <td><button class="table-action status-danger" type="button" data-rule-remove>删除</button></td>
      </tr>`;
    }

    function openAutoDispatch() {
      const cfg = S.getAutoDispatch();
      const matchLabel = cfg.matchBy === "type" ? "工单类型" : "优先级";
      const ruleKeys = (cfg.rules || []).map(() => nextHandlerKey());
      const rows = (cfg.rules || []).map((r, i) => ruleRowHtml(cfg.matchBy, r, ruleKeys[i])).join("");
      const body = `
        <label class="switch-line form-item"><span>启用自动派单</span><input type="checkbox" id="adEnabled" ${cfg.enabled ? "checked" : ""}></label>
        <label class="form-field form-item"><span class="form-label">匹配维度</span>
          <select class="form-control" id="adMatchBy">
            <option value="priority" ${cfg.matchBy !== "type" ? "selected" : ""}>按优先级</option>
            <option value="type" ${cfg.matchBy === "type" ? "selected" : ""}>按工单类型</option>
          </select>
        </label>
        <label class="form-field form-item"><span class="form-label">超时升级（小时）</span><input class="form-control" id="adTimeout" type="number" min="1" value="${esc(cfg.timeoutHours)}"></label>
        <label class="form-field form-item"><span class="form-label">升级对象</span><input class="form-control" id="adEscalate" value="${esc(cfg.escalateTo || "")}"></label>
        <section class="detail-section">
          <h3 class="detail-title">派单规则（${matchLabel} → 处理人）</h3>
          <div class="table-wrap">
            <table class="table user-table">
              <thead><tr><th style="width:120px">匹配值</th><th>处理人</th><th style="width:64px">启用</th><th style="width:64px">操作</th></tr></thead>
              <tbody id="adRuleBody">${rows || ""}</tbody>
            </table>
          </div>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn btn-secondary" type="button" data-rule-add><i class="fa-solid fa-plus"></i> 新增规则</button>
          </div>
        </section>`;
      window.openAppDrawer({
        title: "自动派单规则",
        body,
        footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-drawer-submit="auto">保存</button>',
      });
    }

    function opts(list, cur) {
      return list.map((x) => `<option value="${esc(x)}" ${x === cur ? "selected" : ""}>${esc(x)}</option>`).join("");
    }

    function openCreate() {
      const key = "createHandler";
      const body = `
        <label class="form-field form-item"><span class="form-label form-required">标题</span><input class="form-control" id="tkTitle"></label>
        <label class="form-field form-item"><span class="form-label">类型</span><select class="form-control" id="tkType">${opts(S.meta.ticketTypes)}</select></label>
        <label class="form-field form-item"><span class="form-label">优先级</span><select class="form-control" id="tkPri">${opts(S.meta.priorities, "中")}</select></label>
        <label class="form-field form-item"><span class="form-label">处理人</span>${handlerTriggerHtml(key, [], "single")}</label>
        <label class="form-field form-item"><span class="form-label">关联资产</span><input class="form-control" id="tkAsset"></label>
        <label class="form-field form-item"><span class="form-label">关联漏洞</span><input class="form-control" id="tkVuln"></label>
        <label class="form-field form-item"><span class="form-label">关联告警</span><input class="form-control" id="tkAlarm"></label>`;
      window.openAppDrawer({
        title: "手工派单",
        body,
        footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-drawer-submit="create">确认</button>',
      });
    }

    function openSimple(mode, id) {
      const titles = { dispatch: "派单", transfer: "转派", collab: "协同处理", escalate: "催办升级", review: "审批复核", close: "复测关闭与评价" };
      let extra = `<label class="form-field form-item"><span class="form-label form-required">处理人</span>${handlerTriggerHtml("actionHandler", [], "single")}</label>`;
      if (mode === "collab") extra = `<label class="form-field form-item"><span class="form-label">协同说明</span><textarea class="form-control textarea" id="tkNote"></textarea></label>`;
      if (mode === "escalate") extra = `<label class="form-field form-item"><span class="form-label">升级说明</span><textarea class="form-control textarea" id="tkNote"></textarea></label>`;
      if (mode === "review") extra = `<label class="form-field form-item"><span class="form-label">复核意见</span><textarea class="form-control textarea" id="tkNote" placeholder="确认后进入待复核/可关闭"></textarea></label>`;
      if (mode === "close") {
        extra = `
          <label class="form-field form-item"><span class="form-label form-required">复测结果</span><textarea class="form-control textarea" id="tkRetest"></textarea></label>
          <label class="form-field form-item"><span class="form-label form-required">满意度</span>
            <select class="form-control" id="tkSat"><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
          </label>`;
      }
      window.openAppDrawer({
        title: titles[mode],
        body: extra,
        footer: `<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-drawer-submit="${esc(mode)}" data-id="${esc(id)}">确认</button>`,
      });
    }

    fillSelect("status", S.meta.ticketStatuses);
    fillSelect("priority", S.meta.priorities);
    fillSelect("type", S.meta.ticketTypes);
    render();

    document.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "reset") {
        document.querySelectorAll("[data-filter]").forEach((el) => { el.value = ""; });
        syncPickerTrigger("filter");
        currentPage = 1; render();
      }
      if (action === "search") { currentPage = 1; render(); }
      if (action === "auto") openAutoDispatch();
      if (action === "create") openCreate();

      const tab = event.target.closest("[data-detail-tab]");
      if (tab) {
        const body = document.getElementById("drawerBody");
        body?.querySelectorAll("[data-detail-tab]").forEach((el) => el.classList.toggle("active", el === tab));
        body?.querySelectorAll("[data-detail-pane]").forEach((pane) => pane.classList.toggle("hidden", pane.dataset.detailPane !== tab.dataset.detailTab));
      }

      const openPicker = event.target.closest("[data-open-picker]");
      if (openPicker) {
        event.preventDefault();
        const key = openPicker.dataset.openPicker;
        const mode = openPicker.dataset.pickerMode || "multi";
        const initial = key === "filter"
          ? (document.getElementById("filterHandler").value ? [document.getElementById("filterHandler").value] : [])
          : readHandlerSelected(key);
        openPersonPicker(key, mode, initial);
        return;
      }

      if (event.target.closest("[data-pp-close]")) { closePersonPicker(); return; }
      if (event.target.closest("[data-pp-confirm]")) { confirmPersonPicker(); return; }
      if (event.target.closest("[data-pp-clear]")) {
        pickerState.draft = [];
        renderPersonPicker();
        return;
      }
      if (event.target.closest("[data-pp-search]")) {
        pickerState.peopleKeyword = document.getElementById("ppPeopleKeyword").value.trim();
        renderPersonPicker();
        return;
      }
      if (event.target.closest("[data-pp-reset]")) {
        document.getElementById("ppPeopleKeyword").value = "";
        pickerState.peopleKeyword = "";
        renderPersonPicker();
        return;
      }
      const deptBtn = event.target.closest("[data-pp-dept]");
      if (deptBtn) {
        pickerState.deptId = deptBtn.dataset.ppDept;
        renderPersonPicker();
        return;
      }
      const personBtn = event.target.closest("[data-pp-person]");
      if (personBtn) {
        const name = personBtn.dataset.ppPerson;
        if (pickerState.mode === "single") {
          pickerState.draft = pickerState.draft[0] === name ? [] : [name];
        } else {
          pickerState.draft = pickerState.draft.includes(name)
            ? pickerState.draft.filter((x) => x !== name)
            : pickerState.draft.concat(name);
        }
        renderPersonPicker();
        return;
      }
      const removeBtn = event.target.closest("[data-pp-remove]");
      if (removeBtn) {
        pickerState.draft = pickerState.draft.filter((x) => x !== removeBtn.dataset.ppRemove);
        renderPersonPicker();
        return;
      }
      if (event.target.id === "personPickerMask") { closePersonPicker(); return; }

      if (event.target.closest("[data-rule-add]")) {
        const matchBy = document.getElementById("adMatchBy")?.value || "priority";
        const tbody = document.getElementById("adRuleBody");
        if (tbody) {
          const key = nextHandlerKey();
          tbody.insertAdjacentHTML("beforeend", ruleRowHtml(matchBy, { match: "", handlers: [], enabled: true }, key));
        }
      }
      if (event.target.closest("[data-rule-remove]")) {
        event.target.closest("[data-rule-row]")?.remove();
      }

      const rowBtn = event.target.closest("[data-row]");
      if (rowBtn) {
        const id = rowBtn.dataset.id;
        const mode = rowBtn.dataset.row;
        if (mode === "detail") openDetail(id);
        else openSimple(mode, id);
      }

      const submit = event.target.closest("[data-drawer-submit]");
      if (submit) {
        const mode = submit.dataset.drawerSubmit;
        const id = submit.dataset.id;
        if (mode === "auto") {
          const rules = [...document.querySelectorAll("[data-rule-row]")].map((tr, i) => {
            const key = tr.dataset.handlerKey || `rule-${i}`;
            return {
              id: i + 1,
              match: tr.querySelector("[data-rule-match]")?.value || "",
              handlers: readHandlerSelected(key),
              enabled: !!tr.querySelector("[data-rule-enabled]")?.checked,
            };
          });
          if (rules.some((r) => !r.match || !r.handlers.length)) { alert("请完善每条规则的匹配值与处理人"); return; }
          S.saveAutoDispatch({
            enabled: !!document.getElementById("adEnabled")?.checked,
            matchBy: document.getElementById("adMatchBy")?.value || "priority",
            timeoutHours: Number(document.getElementById("adTimeout")?.value) || 2,
            escalateTo: document.getElementById("adEscalate")?.value.trim() || "安全主管",
            rules,
          });
          alert("自动派单规则已保存（Mock）");
        } else if (mode === "create") {
          const title = document.getElementById("tkTitle")?.value.trim();
          if (!title) { alert("请填写标题"); return; }
          const handler = readHandlerSelected("createHandler")[0] || "";
          S.createTicket({
            title,
            type: document.getElementById("tkType").value,
            priority: document.getElementById("tkPri").value,
            handler: handler || "-",
            asset: document.getElementById("tkAsset").value.trim() || "-",
            vuln: document.getElementById("tkVuln").value.trim() || "-",
            alarm: document.getElementById("tkAlarm").value.trim() || "-",
            status: handler ? "处理中" : "待派单",
          });
        } else if (mode === "dispatch" || mode === "transfer") {
          const handler = readHandlerSelected("actionHandler")[0] || "";
          if (!handler) { alert("请选择处理人"); return; }
          S.updateTicket(
            id,
            { handler, status: mode === "transfer" ? "已转派" : "处理中" },
            mode === "transfer" ? `转派给 ${handler}` : `派单给 ${handler}`
          );
        } else if (mode === "collab") {
          const note = document.getElementById("tkNote")?.value.trim() || "协同处理";
          const row = S.getTicket(id);
          S.updateTicket(id, { related: [...(row.related || []), `协同:${note}`], status: "处理中" }, `协同处理：${note}`);
        } else if (mode === "escalate") {
          const note = document.getElementById("tkNote")?.value.trim() || "催办升级";
          S.updateTicket(id, { status: "已升级", overdue: true }, `催办升级：${note}`);
        } else if (mode === "review") {
          const note = document.getElementById("tkNote")?.value.trim() || "提交复核";
          S.updateTicket(id, { status: "待复核" }, `提交复核：${note}`);
        } else if (mode === "close") {
          const retest = document.getElementById("tkRetest")?.value.trim();
          if (!retest) { alert("请填写复测结果"); return; }
          const sat = Number(document.getElementById("tkSat").value);
          S.updateTicket(id, { status: "已关闭", retest, satisfaction: sat }, `复测关闭：${retest}；满意度 ${sat} 星`);
        }
        document.querySelector("[data-drawer-close]")?.click();
        render();
      }

      const pageNum = event.target.closest("[data-page-number]");
      if (pageNum) { currentPage = Number(pageNum.dataset.pageNumber); render(); }
      if (event.target.closest("[data-page-action='prev']") && currentPage > 1) { currentPage -= 1; render(); }
      if (event.target.closest("[data-page-action='next']")) {
        const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (currentPage < pages) { currentPage += 1; render(); }
      }
    });

    document.addEventListener("change", (event) => {
      if (event.target?.id === "adMatchBy") {
        const optsHtml = ruleMatchOptions(event.target.value);
        document.querySelectorAll("[data-rule-match]").forEach((sel) => { sel.innerHTML = optsHtml; });
        const title = document.querySelector("#drawerBody .detail-title");
        if (title) title.textContent = `派单规则（${event.target.value === "type" ? "工单类型" : "优先级"} → 处理人）`;
      }
    });

    document.getElementById("ppDeptKeyword")?.addEventListener("input", (event) => {
      pickerState.deptKeyword = event.target.value.trim();
      renderPersonPicker();
    });
  </script>
</body>
</html>
