function menuById(id){return menus.find((item)=>String(item.id)===String(id))||menus[0];}
function openMenuDrawer(mode="create", parent){const item=parent||menus[0];let type=parent?.type === "目录" ? "菜单" : "目录";const body=`<label class="form-field form-item"><span class="form-label form-required">上级菜单</span><select class="form-control"><option>${parent?parent.name:"根目录"}</option></select></label><div class="menu-type-segment"><span class="form-label">菜单类型</span><button class="active" data-menu-type="目录">目录</button><button data-menu-type="菜单">菜单</button><button data-menu-type="按钮">按钮</button></div><label class="form-field form-item"><span class="form-label form-required">菜单名称</span><input class="form-control" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label form-required">显示排序</span><input class="form-control" value="1"></label><label class="form-field form-item"><span class="form-label">路由地址</span><input class="form-control" placeholder="填写路由地址或者链接地址"></label><label class="form-field form-item"><span class="form-label">组件路径</span><input class="form-control" placeholder="请输入"></label><label class="form-field form-item"><span class="form-label">权限标识</span><input class="form-control" placeholder="请输入"></label><div class="menu-choice-row"><span class="form-label">是否外链</span><button>是</button><button class="active">否</button></div><div class="menu-choice-row"><span class="form-label">是否显示</span><button class="active">显示</button><button>隐藏</button></div><div class="menu-choice-row"><span class="form-label">菜单状态</span><button class="active">正常</button><button>停用</button></div>`;window.openAppDrawer({title:mode === "edit"?"编辑":"新增",body,footer:`<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-drawer-close>确认</button>`});}
function syncMenuType(type) { const drawerBody = document.getElementById("drawerBody"); if (!drawerBody) return; const fields = drawerBody.querySelectorAll(".form-field"); const route = fields[3]?.closest(".form-field"); const component = fields[4]?.closest(".form-field"); const permission = fields[5]?.closest(".form-field"); const choices = drawerBody.querySelectorAll(".menu-choice-row"); const isDirectory = type === "目录"; const isButton = type === "按钮"; route?.classList.toggle("hidden", isButton); component?.classList.toggle("hidden", isDirectory || isButton); permission?.classList.toggle("hidden", isDirectory); choices.forEach((choice) => choice.classList.toggle("hidden", isButton)); drawerBody.querySelectorAll("[data-menu-type]").forEach((tab) => tab.classList.toggle("active", tab.dataset.menuType === type)); }

syncMenuType = function (type) { const drawerBody = document.getElementById("drawerBody"); if (!drawerBody) return; if (!drawerBody.querySelector(".menu-icon-field")) { const segment = drawerBody.querySelector(".menu-type-segment"); const iconField = document.createElement("label"); iconField.className = "form-field form-item menu-icon-field"; iconField.innerHTML = `<span class="form-label">菜单图标</span><div class="menu-icon-input"><input class="form-control" placeholder="请输入"><button class="btn btn-secondary" type="button">搜索图标</button></div>`; segment?.after(iconField); } const fields = drawerBody.querySelectorAll(".form-field"); const icon = drawerBody.querySelector(".menu-icon-field"); const route = fields[4]?.closest(".form-field"); const component = fields[5]?.closest(".form-field"); const permission = fields[6]?.closest(".form-field"); const choices = drawerBody.querySelectorAll(".menu-choice-row"); const isDirectory = type === "目录"; const isButton = type === "按钮"; icon?.classList.toggle("hidden", isButton); route?.classList.toggle("hidden", isButton); component?.classList.toggle("hidden", isDirectory || isButton); permission?.classList.toggle("hidden", isDirectory); choices.forEach((choice) => choice.classList.toggle("hidden", isButton)); drawerBody.querySelectorAll("[data-menu-type]").forEach((tab) => tab.classList.toggle("active", tab.dataset.menuType === type)); };
const iconLibrary = ["404", "bell", "bug", "build", "button", "cascader", "chart", "checkbox", "clipboard", "code", "color", "component", "dashboard", "date-range", "date", "dict", "documentation", "download", "drag", "druid", "edit", "education", "email", "enter", "folder", "home", "link", "lock", "menu", "message", "monitor", "notification", "plus", "search", "setting", "shopping", "star", "success", "table", "user", "warning", "upload"];
function openIconPicker(button) { const old = document.querySelector(".icon-picker-popup"); if (old) { old.remove(); return; } const field = button.closest(".menu-icon-input"); const input = field.querySelector("input"); const popup = document.createElement("div"); popup.className = "icon-picker-popup"; popup.innerHTML = `<div class="icon-picker-search"><input placeholder="请输入图标名称"><i class="fa-solid fa-magnifying-glass"></i></div><div class="icon-picker-grid">${iconLibrary.map((name) => `<button type="button" data-icon-name="${name}"><i class="fa-solid fa-${name === "home" ? "house" : name === "user" ? "user" : name === "setting" ? "gear" : name === "search" ? "magnifying-glass" : "circle"}"></i><span>${name}</span></button>`).join("")}</div>`; field.append(popup); const search = popup.querySelector(".icon-picker-search input"); search.focus(); search.addEventListener("input", () => popup.querySelectorAll("[data-icon-name]").forEach((item) => item.hidden = !item.dataset.iconName.includes(search.value.trim().toLowerCase()))); popup.addEventListener("click", (event) => { const item = event.target.closest("[data-icon-name]"); if (!item) return; input.value = item.dataset.iconName; input.dataset.iconClass = item.querySelector("i").className; popup.remove(); }); }
