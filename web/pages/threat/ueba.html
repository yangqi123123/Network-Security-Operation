<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>异常行为分析 - 网络安全运维管理平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/threat.css">
</head>
<body class="threat-page ueba-page" data-menu-key="threat.ueba" data-page-section="威胁监测与响应" data-page-title="异常行为分析">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="card filters">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">实体类型</span>
              <select class="form-control" data-filter="entityType"><option value="">全部</option></select>
            </label>
            <label class="form-field"><span class="form-label">敏感度</span>
              <select class="form-control" data-filter="sensitivity"><option value="">全部</option><option>普通</option><option>高</option></select>
            </label>
            <label class="form-field"><span class="form-label">状态</span>
              <select class="form-control" data-filter="status">
                <option value="">全部</option><option>待复核</option><option>已确认</option><option>误报</option><option>已升级</option>
              </select>
            </label>
            <label class="form-field"><span class="form-label">关键字</span>
              <input class="form-control" data-filter="keyword" placeholder="实体/摘要">
            </label>
            <label class="form-field"><span class="form-label">开始日期</span>
              <input class="form-control" data-filter="dateFrom" placeholder="2026-11-01">
            </label>
            <label class="form-field"><span class="form-label">结束日期</span>
              <input class="form-control" data-filter="dateTo" placeholder="2026-11-01">
            </label>
            <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-action="search">搜索</button>
          </div>
        </section>

        <section class="card user-list-card">
          <div class="card-title-row user-toolbar">
            <h2 class="card-title">异常行为列表</h2>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button>
              <button class="btn btn-primary" type="button" data-action="refresh"><i class="fa-solid fa-rotate"></i> 刷新</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table user-table table-actions-sticky">
              <thead>
                <tr>
                  <th>时间</th><th>实体</th><th>类型</th><th>异常摘要</th><th>偏离分</th><th>敏感度</th><th>状态</th><th class="user-actions-col">操作</th>
                </tr>
              </thead>
              <tbody id="uebaBody"></tbody>
            </table>
          </div>
          <div class="pagination" id="uebaPager"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="../../../app/config/menu.js"></script>
  <script src="../../../app/components/sidebar.js"></script>
  <script src="../../../app/components/header.js"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/data/threat-mock.js"></script>
  <script>
    const T = window.Threat;
    const esc = (v) => String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const dash = (v) => (v == null || v === "" ? "-" : esc(v));
    const tagHtml = (meta) => {
      if (!meta || !meta.label) return "-";
      const cls = meta.tagClass ? `tag ${meta.tagClass}` : "tag";
      return `<span class="${cls}">${esc(meta.label)}</span>`;
    };
    const infoItem = (label, value) => `<div class="info-item"><span class="info-label">${label}</span><span class="info-value">${value}</span></div>`;
    let filtered = [];
    let currentPage = 1;
    const pageSize = 10;

    document.querySelector("[data-filter='entityType']").innerHTML = '<option value="">全部</option>' + T.ENTITY_TYPES.map((v) => `<option>${esc(v)}</option>`).join("");

    function readFilter() {
      return Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((el) => [el.dataset.filter, el.value.trim()]));
    }

    function renderPager(total) {
      const pages = Math.max(1, Math.ceil(total / pageSize));
      currentPage = Math.min(currentPage, pages);
      let html = `<span>共 <strong>${total}</strong> 条记录，每页 10 条</span>`;
      html += `<span class="page-item${currentPage === 1 ? " disabled" : ""}" data-page-action="prev">‹</span>`;
      for (let i = 1; i <= pages; i += 1) html += `<span class="page-item${i === currentPage ? " active" : ""}" data-page-number="${i}">${i}</span>`;
      html += `<span class="page-item${currentPage === pages ? " disabled" : ""}" data-page-action="next">›</span>`;
      document.getElementById("uebaPager").innerHTML = html;
    }

    function render() {
      const f = readFilter();
      filtered = T.listAnomalies({
        entityType: f.entityType || undefined,
        sensitivity: f.sensitivity || undefined,
        status: f.status || undefined,
        keyword: f.keyword || undefined,
        dateFrom: f.dateFrom || undefined,
        dateTo: f.dateTo || undefined,
      });
      renderPager(filtered.length);
      const rows = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      document.getElementById("uebaBody").innerHTML = rows.map((a) => `<tr>
        <td>${dash(a.time)}</td><td>${dash(a.entityLabel)}</td><td>${dash(a.entityType)}</td><td>${dash(a.summary)}</td>
        <td>${dash(a.score)}</td><td>${dash(a.sensitivity)}</td><td>${tagHtml(T.anomalyStatusTag(a.status))}</td>
        <td class="user-actions-col">
          <button class="table-action" type="button" data-row="detail" data-id="${esc(a.id)}">详情</button>
          <button class="table-action" type="button" data-row="profile" data-id="${esc(a.id)}" data-entity="${esc(a.entityId)}">实体画像</button>
          <button class="table-action" type="button" data-row="false" data-id="${esc(a.id)}">标记误报</button>
          <button class="table-action" type="button" data-row="escalate" data-id="${esc(a.id)}">升级为事件</button>
        </td>
      </tr>`).join("") || `<tr><td colspan="8" style="text-align:center;color:var(--text-secondary)">暂无数据</td></tr>`;
    }

    function openDetail(id) {
      const a = T.getAnomaly(id);
      if (!a) return;
      const c = a.context || {};
      const body = `<section class="detail-section"><h3 class="detail-title">行为上下文</h3><div class="detail-grid user-detail-grid">
        ${infoItem("谁", dash(c.who))}${infoItem("何时", dash(c.when))}${infoItem("从哪里", dash(c.where))}
        ${infoItem("访问了什么", dash(c.what))}${infoItem("做了什么", dash(c.action))}${infoItem("结果如何", dash(c.result))}
        ${infoItem("是否偏离基线", dash(c.baseline))}${infoItem("偏离分", dash(a.score))}
        ${infoItem("状态", tagHtml(T.anomalyStatusTag(a.status)))}${infoItem("备注信息", "-")}
      </div></section>`;
      window.openAppDrawer({ title: "异常详情", body, footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button>' });
    }

    function openProfile(entityId) {
      const e = T.getEntity(entityId);
      if (!e) return;
      const behaviors = (e.recentBehaviors || []).map((b) => `<li>${dash(b)}</li>`).join("") || "<li>-</li>";
      const related = (e.relatedAnomalyIds || []).slice(0, 5).map((id) => `<li>${dash(id)}</li>`).join("") || "<li>-</li>";
      const body = `<section class="detail-section"><h3 class="detail-title">实体画像</h3><div class="detail-grid user-detail-grid">
        ${infoItem("实体", dash(e.name))}${infoItem("类型", dash(e.type))}${infoItem("敏感度", dash(e.sensitivity))}
        ${infoItem("部门", dash(e.attrs?.dept))}${infoItem("负责人", dash(e.attrs?.owner))}
        ${infoItem("风险分", dash(e.attrs?.riskScore))}${infoItem("备注信息", "-")}
      </div></section>
      <section class="detail-section threat-detail-block"><h3 class="detail-title">近期行为</h3><ul>${behaviors}</ul></section>
      <section class="detail-section threat-detail-block"><h3 class="detail-title">关联异常</h3><ul>${related}</ul></section>`;
      window.openAppDrawer({ title: "实体画像", body, footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button>' });
    }

    render();

    document.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "search") { currentPage = 1; render(); }
      if (action === "reset") { document.querySelectorAll("[data-filter]").forEach((el) => { el.value = ""; }); currentPage = 1; render(); }
      if (action === "refresh") render();
      if (action === "export") alert("导出功能为原型演示，当前不会生成真实文件。");

      const rowBtn = event.target.closest("[data-row]");
      if (rowBtn) {
        if (rowBtn.dataset.row === "detail") openDetail(rowBtn.dataset.id);
        if (rowBtn.dataset.row === "profile") openProfile(rowBtn.dataset.entity);
        if (rowBtn.dataset.row === "false") { T.markAnomaly(rowBtn.dataset.id, "误报"); render(); }
        if (rowBtn.dataset.row === "escalate") {
          const updated = T.escalateAnomaly(rowBtn.dataset.id);
          alert(`已升级为事件（Mock）：${updated?.eventRef || "-"}`);
          render();
        }
      }

      const pageNum = event.target.closest("[data-page-number]");
      if (pageNum) { currentPage = Number(pageNum.dataset.pageNumber); render(); }
      const pageAct = event.target.closest("[data-page-action]")?.dataset.pageAction;
      if (pageAct === "prev" && currentPage > 1) { currentPage -= 1; render(); }
      if (pageAct === "next") {
        const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (currentPage < pages) { currentPage += 1; render(); }
      }
    });
  </script>
</body>
</html>
