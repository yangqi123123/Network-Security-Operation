<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安全事件分析 - 网络安全运维管理平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/threat.css">
</head>
<body class="threat-page siem-page" data-menu-key="threat.siem" data-page-section="威胁监测与响应" data-page-title="安全事件分析">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="card filters">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">等级</span>
              <select class="form-control" data-filter="level"><option value="">全部</option></select>
            </label>
            <label class="form-field"><span class="form-label">状态</span>
              <select class="form-control" data-filter="status"><option value="">全部</option></select>
            </label>
            <label class="form-field"><span class="form-label">来源类型</span>
              <select class="form-control" data-filter="sourceType"><option value="">全部</option></select>
            </label>
            <label class="form-field"><span class="form-label">关键字</span>
              <input class="form-control" data-filter="keyword" placeholder="标题/资产/编号">
            </label>
            <label class="form-field"><span class="form-label">开始日期</span>
              <input class="form-control" data-filter="dateFrom" placeholder="2026-11-01">
            </label>
            <label class="form-field"><span class="form-label">结束日期</span>
              <input class="form-control" data-filter="dateTo" placeholder="2026-11-01">
            </label>
            <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-action="search">搜索</button>
          </div>
        </section>

        <section class="card user-list-card">
          <div class="card-title-row user-toolbar">
            <h2 class="card-title">安全事件列表</h2>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button>
              <button class="btn btn-primary" type="button" data-action="refresh"><i class="fa-solid fa-rotate"></i> 刷新</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table user-table table-actions-sticky">
              <thead>
                <tr>
                  <th>时间</th><th>事件标题</th><th>来源</th><th>资产</th><th>等级</th><th>归并数</th><th>状态</th><th class="user-actions-col">操作</th>
                </tr>
              </thead>
              <tbody id="siemBody"></tbody>
            </table>
          </div>
          <div class="pagination" id="siemPager"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="../../../app/config/menu.js"></script>
  <script src="../../../app/components/sidebar.js"></script>
  <script src="../../../app/components/header.js"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/data/threat-mock.js"></script>
  <script>
    const T = window.Threat;
    const esc = (v) => String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const dash = (v) => (v == null || v === "" ? "-" : esc(v));
    const tagHtml = (meta) => {
      if (!meta || !meta.label) return "-";
      const cls = meta.tagClass ? `tag ${meta.tagClass}` : "tag";
      return `<span class="${cls}">${esc(meta.label)}</span>`;
    };
    const infoItem = (label, value) => `<div class="info-item"><span class="info-label">${label}</span><span class="info-value">${value}</span></div>`;
    let filtered = [];
    let currentPage = 1;
    const pageSize = 10;

    function fillFilters() {
      document.querySelector("[data-filter='level']").innerHTML = '<option value="">全部</option>' + T.EVENT_LEVELS.map((v) => `<option>${esc(v)}</option>`).join("");
      document.querySelector("[data-filter='status']").innerHTML = '<option value="">全部</option>' + T.EVENT_STATUSES.map((v) => `<option>${esc(v)}</option>`).join("");
      document.querySelector("[data-filter='sourceType']").innerHTML = '<option value="">全部</option>' + T.SOURCE_TYPES.map((v) => `<option>${esc(v)}</option>`).join("");
    }

    function readFilter() {
      return Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((el) => [el.dataset.filter, el.value.trim()]));
    }

    function renderPager(total) {
      const pages = Math.max(1, Math.ceil(total / pageSize));
      currentPage = Math.min(currentPage, pages);
      let html = `<span>共 <strong>${total}</strong> 条记录，每页 10 条</span>`;
      html += `<span class="page-item${currentPage === 1 ? " disabled" : ""}" data-page-action="prev">‹</span>`;
      for (let i = 1; i <= pages; i += 1) html += `<span class="page-item${i === currentPage ? " active" : ""}" data-page-number="${i}">${i}</span>`;
      html += `<span class="page-item${currentPage === pages ? " disabled" : ""}" data-page-action="next">›</span>`;
      document.getElementById("siemPager").innerHTML = html;
    }

    function render() {
      const f = readFilter();
      filtered = T.listEvents({
        level: f.level || undefined,
        status: f.status || undefined,
        sourceType: f.sourceType || undefined,
        keyword: f.keyword || undefined,
        dateFrom: f.dateFrom || undefined,
        dateTo: f.dateTo || undefined,
      });
      renderPager(filtered.length);
      const rows = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      document.getElementById("siemBody").innerHTML = rows.map((row) => `<tr>
        <td>${dash(row.time)}</td>
        <td>${dash(row.title)}</td>
        <td>${dash(row.sourceType)}</td>
        <td>${dash(row.asset)}</td>
        <td>${tagHtml(T.levelTag(row.level))}</td>
        <td>${dash(row.mergeCount)}</td>
        <td>${tagHtml(T.statusTag(row.status))}</td>
        <td class="user-actions-col">
          <button class="table-action" type="button" data-row="detail" data-id="${esc(row.id)}">详情</button>
          <button class="table-action" type="button" data-row="judge" data-id="${esc(row.id)}">研判</button>
          <button class="table-action" type="button" data-row="assign" data-id="${esc(row.id)}">分派</button>
          <button class="table-action" type="button" data-row="handle" data-id="${esc(row.id)}">处置</button>
          <button class="table-action" type="button" data-row="review" data-id="${esc(row.id)}">复盘</button>
        </td>
      </tr>`).join("") || `<tr><td colspan="8" style="text-align:center;color:var(--text-secondary)">暂无数据</td></tr>`;
    }

    function openDetail(id) {
      const row = T.getEvent(id);
      if (!row) return;
      const logs = (row.logs || []).map((l) => `<tr><td>${dash(l.time)}</td><td>${dash(l.raw)}</td></tr>`).join("") || `<tr><td colspan="2">-</td></tr>`;
      const timeline = (row.timeline || []).map((t) => `<div class="task"><span class="dot" style="background:var(--primary)"></span><div><strong>${esc(t.action)}</strong><div class="helper-text">${dash(t.time)} · ${dash(t.actor)}</div><div>${dash(t.note)}</div></div></div>`).join("") || "-";
      const body = `
        <section class="detail-section">
          <h3 class="detail-title">基础信息</h3>
          <div class="detail-grid user-detail-grid">
            ${infoItem("事件编号", dash(row.id))}
            ${infoItem("时间", dash(row.time))}
            ${infoItem("标题", dash(row.title))}
            ${infoItem("来源类型", dash(row.sourceType))}
            ${infoItem("资产", dash(row.asset))}
            ${infoItem("等级", tagHtml(T.levelTag(row.level)))}
            ${infoItem("归并数", dash(row.mergeCount))}
            ${infoItem("状态", tagHtml(T.statusTag(row.status)))}
            ${infoItem("备注信息", "-")}
          </div>
        </section>
        <section class="detail-section threat-detail-block">
          <h3 class="detail-title">关联日志摘要</h3>
          <table class="threat-log-table"><thead><tr><th>时间</th><th>内容</th></tr></thead><tbody>${logs}</tbody></table>
        </section>
        <section class="detail-section threat-detail-block">
          <h3 class="detail-title">处置时间线</h3>
          <div class="timeline">${timeline}</div>
        </section>`;
      window.openAppDrawer({ title: "事件详情", body, footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button>' });
    }

    function openAction(mode, id) {
      const row = T.getEvent(id);
      if (!row) return;
      const titles = { judge: "研判", assign: "分派", handle: "处置", review: "复盘" };
      let form = "";
      if (mode === "judge") {
        form = `<label class="form-field form-item"><span class="form-label form-required">研判结论</span><select class="form-control" data-f="conclusion"><option>确认威胁</option><option>误报</option><option>需观察</option></select></label>
          <label class="form-field form-item"><span class="form-label">备注</span><textarea class="form-control textarea" data-f="remark" placeholder="请输入"></textarea></label>`;
      } else if (mode === "assign") {
        form = `<label class="form-field form-item"><span class="form-label form-required">处理人</span><select class="form-control" data-f="assignee"><option>分析员A</option><option>值班员B</option><option>响应组C</option></select></label>
          <label class="form-field form-item"><span class="form-label">备注</span><textarea class="form-control textarea" data-f="remark"></textarea></label>`;
      } else if (mode === "handle") {
        form = `<label class="form-field form-item"><span class="form-label form-required">处置动作</span><select class="form-control" data-f="action"><option>封禁</option><option>隔离</option><option>加固</option><option>关闭</option></select></label>
          <label class="form-field form-item"><span class="form-label">备注</span><textarea class="form-control textarea" data-f="remark"></textarea></label>`;
      } else {
        form = `<label class="form-field form-item"><span class="form-label form-required">复盘总结</span><textarea class="form-control textarea" data-f="remark" placeholder="请输入复盘结论"></textarea></label>`;
      }
      window.openAppDrawer({
        title: titles[mode],
        body: form,
        footer: `<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-confirm="${mode}" data-id="${esc(id)}">确认</button>`,
      });
    }

    function confirmAction(mode, id) {
      const drawer = document.getElementById("drawerBody") || document.querySelector(".drawer-body");
      const get = (k) => drawer?.querySelector(`[data-f="${k}"]`)?.value || "";
      const now = new Date();
      const ts = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`;
      let patch = { _timelineEntry: { time: ts, actor: "当前用户", action: "", note: get("remark") || "-" } };
      if (mode === "judge") {
        const c = get("conclusion");
        patch.status = c === "误报" ? "已关闭" : "研判中";
        patch._timelineEntry.action = `研判：${c}`;
      } else if (mode === "assign") {
        patch.status = "已分派";
        patch._timelineEntry.action = `分派给 ${get("assignee")}`;
      } else if (mode === "handle") {
        const a = get("action");
        patch.status = a === "关闭" ? "已关闭" : "处置中";
        patch._timelineEntry.action = `处置：${a}`;
      } else {
        patch.status = "已关闭";
        patch._timelineEntry.action = "复盘关闭";
      }
      T.updateEvent(id, patch);
      document.querySelector("[data-drawer-close]")?.click();
      render();
    }

    fillFilters();
    render();

    document.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "search") { currentPage = 1; render(); }
      if (action === "reset") { document.querySelectorAll("[data-filter]").forEach((el) => { el.value = ""; }); currentPage = 1; render(); }
      if (action === "refresh") render();
      if (action === "export") alert("导出功能为原型演示，当前不会生成真实文件。");

      const rowBtn = event.target.closest("[data-row]");
      if (rowBtn) {
        if (rowBtn.dataset.row === "detail") openDetail(rowBtn.dataset.id);
        else openAction(rowBtn.dataset.row, rowBtn.dataset.id);
      }
      const confirm = event.target.closest("[data-confirm]");
      if (confirm) confirmAction(confirm.dataset.confirm, confirm.dataset.id);

      const pageNum = event.target.closest("[data-page-number]");
      if (pageNum) { currentPage = Number(pageNum.dataset.pageNumber); render(); }
      const pageAct = event.target.closest("[data-page-action]")?.dataset.pageAction;
      if (pageAct === "prev" && currentPage > 1) { currentPage -= 1; render(); }
      if (pageAct === "next") {
        const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (currentPage < pages) { currentPage += 1; render(); }
      }
    });
  </script>
</body>
</html>
