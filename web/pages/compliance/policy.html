<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安全策略集中管理与审计 - 网络安全运维管理平台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/compliance.css">
</head>
<body class="cp-page" data-menu-key="compliance.policy" data-page-section="安全合规与审计" data-page-title="策略管理与审计">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="metric-grid" id="cpPolicyMetrics">
          <article class="metric-card"><div class="metric-label">策略总数</div><div class="metric-number" data-m="total">0</div></article>
          <article class="metric-card"><div class="metric-label">启用中</div><div class="metric-number" data-m="enabled">0</div></article>
          <article class="metric-card"><div class="metric-label">待审批</div><div class="metric-number" data-m="pendingApproval">0</div></article>
          <article class="metric-card"><div class="metric-label">高风险变更待复核</div><div class="metric-number" data-m="dualPending">0</div></article>
        </section>

        <section class="card filters">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">策略类型</span>
              <select class="form-control" data-filter="type"><option value="">全部</option></select>
            </label>
            <label class="form-field"><span class="form-label">分组</span>
              <select class="form-control" data-filter="group"><option value="">全部</option></select>
            </label>
            <label class="form-field"><span class="form-label">启停状态</span>
              <select class="form-control" data-filter="enabled">
                <option value="">全部</option>
                <option value="true">启用</option>
                <option value="false">停用</option>
              </select>
            </label>
            <label class="form-field"><span class="form-label">审批状态</span>
              <select class="form-control" data-filter="approvalStatus">
                <option value="">全部</option>
                <option value="draft">草稿</option>
                <option value="pending">待审批</option>
                <option value="approved">已通过</option>
                <option value="rejected">已驳回</option>
                <option value="dual">待双人复核</option>
              </select>
            </label>
            <label class="form-field"><span class="form-label">关键字</span>
              <input class="form-control" data-filter="keyword" placeholder="名称/范围/内容">
            </label>
            <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-action="search">搜索</button>
          </div>
        </section>

        <section class="card user-list-card">
          <div class="card-title-row user-toolbar">
            <h2 class="card-title">策略列表</h2>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button>
              <button class="btn btn-secondary" type="button" data-action="from-template"><i class="fa-solid fa-copy"></i> 从模板创建</button>
              <button class="btn btn-primary" type="button" data-action="create"><i class="fa-solid fa-plus"></i> 新建策略</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table user-table table-actions-sticky">
              <thead>
                <tr>
                  <th>策略名称</th><th>类型</th><th>分组</th><th>作用范围摘要</th><th>版本</th>
                  <th>启停</th><th>审批状态</th><th>最近变更人</th><th>最近变更时间</th>
                  <th class="user-actions-col">操作</th>
                </tr>
              </thead>
              <tbody id="cpPolicyBody"></tbody>
            </table>
          </div>
          <div class="pagination" id="cpPolicyPager"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="../../../app/config/menu.js"></script>
  <script src="../../../app/components/sidebar.js"></script>
  <script src="../../../app/components/header.js"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/data/compliance-mock.js"></script>
  <script>
    const CP = window.Compliance;
    const esc = (v) => String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const dash = (v) => (v == null || v === "" ? "-" : esc(v));
    let filtered = [];
    let currentPage = 1;
    const pageSize = 10;

    function tagHtml(meta) {
      if (!meta || !meta.label) return `<span class="tag">-</span>`;
      const cls = meta.tagClass ? `tag ${meta.tagClass}` : "tag";
      return `<span class="${cls}">${esc(meta.label)}</span>`;
    }

    function infoItem(label, value) {
      return `<div class="info-item"><span class="info-label">${label}</span><span class="info-value">${value}</span></div>`;
    }

    function fillFilters() {
      document.querySelector("[data-filter='type']").innerHTML =
        '<option value="">全部</option>' + CP.POLICY_TYPES.map((t) => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
      document.querySelector("[data-filter='group']").innerHTML =
        '<option value="">全部</option>' + CP.meta.groups.map((g) => `<option value="${esc(g)}">${esc(g)}</option>`).join("");
    }

    function readFilter() {
      return Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((el) => [el.dataset.filter, el.value.trim()]));
    }

    function refreshMetrics() {
      const m = CP.policyMetrics();
      document.querySelectorAll("#cpPolicyMetrics [data-m]").forEach((el) => {
        el.textContent = m[el.dataset.m] ?? 0;
      });
    }

    function renderPager(total) {
      const pages = Math.max(1, Math.ceil(total / pageSize));
      currentPage = Math.min(currentPage, pages);
      let html = `<span>共 <strong>${total}</strong> 条记录，每页 10 条</span>`;
      html += `<span class="page-item${currentPage === 1 ? " disabled" : ""}" data-page-action="prev">‹</span>`;
      for (let i = 1; i <= pages; i += 1) {
        html += `<span class="page-item${i === currentPage ? " active" : ""}" data-page-number="${i}">${i}</span>`;
      }
      html += `<span class="page-item${currentPage === pages ? " disabled" : ""}" data-page-action="next">›</span>`;
      document.getElementById("cpPolicyPager").innerHTML = html;
    }

    function render() {
      const f = readFilter();
      filtered = CP.listPolicies({
        type: f.type || undefined,
        group: f.group || undefined,
        enabled: f.enabled || undefined,
        approvalStatus: f.approvalStatus || undefined,
        keyword: f.keyword || undefined,
      });
      renderPager(filtered.length);
      const rows = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      document.getElementById("cpPolicyBody").innerHTML = rows.map((row) => `<tr data-id="${esc(row.id)}">
        <td>${dash(row.name)}</td>
        <td>${dash(row.type)}</td>
        <td>${dash(row.group)}</td>
        <td>${dash(row.scopeSummary)}</td>
        <td>${dash(row.version)}</td>
        <td>${tagHtml(CP.policyEnabledTag(row.enabled))}</td>
        <td>${tagHtml(CP.approvalTag(row.approvalStatus))}</td>
        <td>${dash(row.updatedBy)}</td>
        <td>${dash(row.updatedAt)}</td>
        <td class="user-actions-col">
          <button class="table-action" type="button" data-row="detail" data-id="${esc(row.id)}">详情</button>
          <button class="table-action" type="button" data-row="edit" data-id="${esc(row.id)}">编辑</button>
          <button class="table-action" type="button" data-row="toggle" data-id="${esc(row.id)}">启停</button>
          <button class="table-action" type="button" data-row="dispatch" data-id="${esc(row.id)}">下发</button>
          <button class="table-action" type="button" data-row="rollback" data-id="${esc(row.id)}">回滚</button>
          <button class="table-action" type="button" data-row="exception" data-id="${esc(row.id)}">例外</button>
          <button class="table-action" type="button" data-row="audit" data-id="${esc(row.id)}">审计</button>
        </td>
      </tr>`).join("") || `<tr><td colspan="10" style="text-align:center;color:var(--text-secondary)">暂无数据</td></tr>`;
      refreshMetrics();
    }

    function policyForm(row, fromTemplate) {
      const typeOpts = CP.POLICY_TYPES.map((t) => `<option value="${esc(t)}" ${row?.type === t ? "selected" : ""}>${esc(t)}</option>`).join("");
      const groupOpts = CP.meta.groups.map((g) => `<option value="${esc(g)}" ${row?.group === g ? "selected" : ""}>${esc(g)}</option>`).join("");
      const effectOpts = Object.entries(CP.EFFECT_LABEL).map(([k, v]) => `<option value="${k}" ${row?.effectMode === k ? "selected" : ""}>${esc(v)}</option>`).join("");
      const tplHint = fromTemplate ? `<p class="cp-muted">已从模板预填类型与名称，可继续调整。</p>` : "";
      return `${tplHint}
        <label class="form-field form-item"><span class="form-label form-required">策略名称</span><input class="form-control" id="polName" value="${esc(row?.name || "")}" placeholder="请输入"></label>
        <label class="form-field form-item"><span class="form-label form-required">策略类型</span><select class="form-control" id="polType">${typeOpts}</select></label>
        <label class="form-field form-item"><span class="form-label">分组</span><select class="form-control" id="polGroup">${groupOpts}</select></label>
        <label class="form-field form-item"><span class="form-label">继承源</span><input class="form-control" id="polInherit" value="${esc(row?.inheritFrom || "")}" placeholder="可选"></label>
        <label class="form-field form-item"><span class="form-label">作用范围摘要</span>
          <div class="cp-checkboxes" id="polScopeBoxes">
            ${CP.meta.departments.map((d) => `<label><input type="checkbox" value="部门:${esc(d)}"> ${esc(d)}</label>`).join("")}
            ${CP.meta.assetGroups.map((d) => `<label><input type="checkbox" value="资产组:${esc(d)}"> ${esc(d)}</label>`).join("")}
          </div>
          <input class="form-control" id="polScope" style="margin-top:8px" value="${esc(row?.scopeSummary || "")}" placeholder="或直接填写范围摘要">
        </label>
        <label class="form-field form-item"><span class="form-label">生效方式</span><select class="form-control" id="polEffect">${effectOpts}</select></label>
        <label class="form-field form-item"><span class="form-label">策略内容摘要</span><textarea class="form-control textarea" id="polContent" placeholder="请输入">${esc(row?.contentSummary || "")}</textarea></label>
        <label class="switch-line form-item"><span>高风险策略</span><input type="checkbox" id="polHighRisk" ${row?.highRisk ? "checked" : ""}></label>`;
    }

    function collectPolicyPayload(id) {
      const checked = [...document.querySelectorAll("#polScopeBoxes input:checked")].map((el) => el.value);
      const scopeInput = document.getElementById("polScope").value.trim();
      const scopeSummary = scopeInput || (checked.length ? checked.join(" | ") : "-");
      return {
        id: id || undefined,
        name: document.getElementById("polName").value.trim(),
        type: document.getElementById("polType").value,
        group: document.getElementById("polGroup").value,
        inheritFrom: document.getElementById("polInherit").value.trim() || "-",
        scopeSummary,
        effectMode: document.getElementById("polEffect").value,
        contentSummary: document.getElementById("polContent").value.trim(),
        highRisk: document.getElementById("polHighRisk").checked,
      };
    }

    function openDetail(id) {
      const row = CP.getPolicy(id);
      if (!row) return;
      const versions = (row.versions || []).length
        ? `<table class="cp-subtable"><thead><tr><th>版本</th><th>摘要</th><th>时间</th></tr></thead><tbody>${row.versions.map((v) => `<tr><td>${dash(v.version)}</td><td>${dash(v.summary)}</td><td>${dash(v.updatedAt)}</td></tr>`).join("")}</tbody></table>`
        : `<div class="cp-muted">暂无版本</div>`;
      const audits = (row.audits || []).slice(0, 5);
      const auditTable = audits.length
        ? `<table class="cp-subtable"><thead><tr><th>时间</th><th>操作</th><th>变更</th><th>审批</th></tr></thead><tbody>${audits.map((a) => `<tr><td>${dash(a.time)}</td><td>${dash(a.action)}</td><td>${dash(a.changeSummary)}</td><td>${dash(a.approvalResult)}</td></tr>`).join("")}</tbody></table>`
        : `<div class="cp-muted">暂无审计</div>`;
      const body = `
        <section class="detail-section">
          <h3 class="detail-title">策略信息</h3>
          <div class="detail-grid user-detail-grid">
            ${infoItem("策略名称", dash(row.name))}
            ${infoItem("类型", dash(row.type))}
            ${infoItem("分组", dash(row.group))}
            ${infoItem("继承源", dash(row.inheritFrom))}
            ${infoItem("作用范围", dash(row.scopeSummary))}
            ${infoItem("版本", dash(row.version))}
            ${infoItem("启停", tagHtml(CP.policyEnabledTag(row.enabled)))}
            ${infoItem("审批状态", tagHtml(CP.approvalTag(row.approvalStatus)))}
            ${infoItem("生效方式", esc(CP.effectModeLabel(row.effectMode)))}
            ${infoItem("高风险", row.highRisk ? "是" : "否")}
            ${infoItem("最近变更人", dash(row.updatedBy))}
            ${infoItem("最近变更时间", dash(row.updatedAt))}
            ${infoItem("内容摘要", dash(row.contentSummary))}
          </div>
        </section>
        <section class="detail-section"><h3 class="detail-title">版本摘要</h3>${versions}</section>
        <section class="detail-section"><h3 class="detail-title">最近审计</h3>${auditTable}</section>`;
      window.openAppDrawer({ title: "策略详情", body, footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button>' });
    }

    function openEdit(id) {
      const row = id ? CP.getPolicy(id) : null;
      window.openAppDrawer({
        title: id ? "编辑策略" : "新建策略",
        body: policyForm(row, false),
        footer: `<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-drawer-submit="save" data-id="${esc(id || "")}">确认</button>`,
      });
    }

    function openFromTemplate() {
      const opts = CP.listPolicyTemplates().map((t) => `<option value="${esc(t.id)}">${esc(t.name)}（${esc(t.type)}）</option>`).join("");
      const body = `<label class="form-field form-item"><span class="form-label form-required">选择模板</span><select class="form-control" id="tplSelect">${opts}</select></label>`;
      window.openAppDrawer({
        title: "从模板创建",
        body,
        footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-drawer-submit="pick-template">下一步</button>',
      });
    }

    function openConfirmAction(id, mode) {
      const row = CP.getPolicy(id);
      if (!row) return;
      const titles = { toggle: "启停策略", dispatch: "下发策略", rollback: "回滚策略" };
      const dual = row.highRisk
        ? `<label class="switch-line form-item"><span>双人复核已完成</span><input type="checkbox" id="dualConfirmed"></label><p class="cp-muted">高风险策略变更须勾选后才能确认。</p>`
        : `<p class="cp-muted">当前策略非高风险，确认后直接生效。</p>`;
      const tip = mode === "toggle"
        ? `当前状态：${row.enabled ? "启用" : "停用"}，确认后将变为：${row.enabled ? "停用" : "启用"}。`
        : mode === "rollback"
          ? `将回滚到上一版本（当前 ${esc(row.version)}）。`
          : `将按「${esc(CP.effectModeLabel(row.effectMode))}」下发。`;
      const body = `<p>${tip}</p>${dual}`;
      window.openAppDrawer({
        title: titles[mode],
        body,
        footer: `<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-drawer-submit="${mode}" data-id="${esc(id)}">确认</button>`,
      });
    }

    function openException(id) {
      const body = `
        <label class="form-field form-item"><span class="form-label form-required">例外范围</span><input class="form-control" id="exScope" placeholder="请输入"></label>
        <label class="form-field form-item"><span class="form-label form-required">原因</span><textarea class="form-control textarea" id="exReason" placeholder="请输入"></textarea></label>
        <label class="form-field form-item"><span class="form-label form-required">有效期至</span><input class="form-control" id="exUntil" placeholder="2026-12-31"></label>
        <label class="form-field form-item"><span class="form-label form-required">审批人</span><input class="form-control" id="exApprover" placeholder="请输入"></label>`;
      window.openAppDrawer({
        title: "策略例外",
        body,
        footer: `<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-drawer-submit="exception" data-id="${esc(id)}">确认</button>`,
      });
    }

    function openAudit(id) {
      const audits = CP.listPolicyAudits(id);
      const table = audits.length
        ? `<table class="cp-subtable"><thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>变更内容</th><th>影响范围</th><th>审批结果</th></tr></thead><tbody>${audits.map((a) => `<tr><td>${dash(a.time)}</td><td>${dash(a.actor)}</td><td>${dash(a.action)}</td><td>${dash(a.changeSummary)}</td><td>${dash(a.scope)}</td><td>${dash(a.approvalResult)}</td></tr>`).join("")}</tbody></table>`
        : `<div class="cp-muted">暂无审计记录</div>`;
      window.openAppDrawer({ title: "策略审计记录", body: table, footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button>' });
    }

    fillFilters();
    render();

    document.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "search") { currentPage = 1; render(); }
      if (action === "reset") {
        document.querySelectorAll("[data-filter]").forEach((el) => { el.value = ""; });
        currentPage = 1;
        render();
      }
      if (action === "export") alert("导出功能为原型演示，当前不会生成真实文件。");
      if (action === "create") openEdit("");
      if (action === "from-template") openFromTemplate();

      const rowBtn = event.target.closest("[data-row]");
      if (rowBtn) {
        const id = rowBtn.dataset.id;
        const op = rowBtn.dataset.row;
        if (op === "detail") openDetail(id);
        if (op === "edit") openEdit(id);
        if (op === "toggle" || op === "dispatch" || op === "rollback") openConfirmAction(id, op);
        if (op === "exception") openException(id);
        if (op === "audit") openAudit(id);
      }

      const pageNum = event.target.closest("[data-page-number]");
      if (pageNum) { currentPage = Number(pageNum.dataset.pageNumber); render(); }
      const pageAct = event.target.closest("[data-page-action]")?.dataset.pageAction;
      if (pageAct === "prev" && currentPage > 1) { currentPage -= 1; render(); }
      if (pageAct === "next") {
        const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (currentPage < pages) { currentPage += 1; render(); }
      }

      const submit = event.target.closest("[data-drawer-submit]");
      if (!submit) return;
      const mode = submit.dataset.drawerSubmit;
      const id = submit.dataset.id;
      const dualConfirmed = document.getElementById("dualConfirmed")?.checked;

      if (mode === "pick-template") {
        const tpl = CP.listPolicyTemplates().find((t) => t.id === document.getElementById("tplSelect").value);
        window.closeAppDrawer();
        window.openAppDrawer({
          title: "从模板创建",
          body: policyForm({ name: tpl.name, type: tpl.type, group: "默认分组", effectMode: "immediate", highRisk: false }, true),
          footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-drawer-submit="save" data-id="">确认</button>',
        });
        return;
      }
      if (mode === "save") {
        const payload = collectPolicyPayload(id || undefined);
        if (!payload.name) { alert("请填写策略名称"); return; }
        CP.savePolicy(payload);
        window.closeAppDrawer();
        currentPage = 1;
        render();
      }
      if (mode === "toggle") {
        const row = CP.getPolicy(id);
        const res = CP.setPolicyEnabled(id, !row.enabled, { dualConfirmed });
        if (!res.ok) { alert(res.message); return; }
        window.closeAppDrawer();
        render();
      }
      if (mode === "dispatch") {
        const res = CP.dispatchPolicy(id, { dualConfirmed });
        if (!res.ok) { alert(res.message); return; }
        window.closeAppDrawer();
        render();
      }
      if (mode === "rollback") {
        const res = CP.rollbackPolicy(id, { dualConfirmed });
        if (!res.ok) { alert(res.message); return; }
        window.closeAppDrawer();
        render();
      }
      if (mode === "exception") {
        const res = CP.addPolicyException(id, {
          scope: document.getElementById("exScope").value.trim(),
          reason: document.getElementById("exReason").value.trim(),
          validUntil: document.getElementById("exUntil").value.trim(),
          approver: document.getElementById("exApprover").value.trim(),
        });
        if (!res.ok) { alert(res.message); return; }
        window.closeAppDrawer();
        render();
      }
    });
  </script>
</body>
</html>
