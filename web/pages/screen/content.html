<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>规范内容管理 - 网络安全运维管理平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/screen-protect.css">
</head>
<body class="sp-page" data-menu-key="screen.content" data-page-section="电子屏防护管理" data-page-title="规范内容管理">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="metric-grid" id="spContentMetrics">
          <article class="metric-card"><div class="metric-label">今日切断</div><div class="metric-number" data-m="todayCut">0</div></article>
          <article class="metric-card"><div class="metric-label">自动恢复</div><div class="metric-number" data-m="todayRestore">0</div></article>
          <article class="metric-card"><div class="metric-label">待人工确认</div><div class="metric-number" data-m="pendingConfirm">0</div></article>
        </section>

        <section class="card filters">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">电子屏</span>
              <select class="form-control" data-filter="screenId"><option value="">全部</option></select>
            </label>
            <label class="form-field"><span class="form-label">处置结果</span>
              <select class="form-control" data-filter="result">
                <option value="">全部</option>
                <option value="cut_done">已切断</option>
                <option value="restored">已恢复</option>
                <option value="pending_confirm">待确认</option>
              </select>
            </label>
            <label class="form-field"><span class="form-label">触发来源</span>
              <select class="form-control" data-filter="mode">
                <option value="">全部</option>
                <option value="auto">自动</option>
                <option value="manual">人工</option>
              </select>
            </label>
            <label class="form-field"><span class="form-label">触发类别</span>
              <select class="form-control" data-filter="triggerCategory">
                <option value="">全部</option>
                <option value="porn">色情</option>
                <option value="politics">涉政</option>
                <option value="terror">暴恐</option>
                <option value="abuse">辱骂</option>
              </select>
            </label>
            <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-action="search">搜索</button>
          </div>
        </section>

        <section class="card user-list-card">
          <div class="card-title-row user-toolbar">
            <h2 class="card-title">内容处置记录</h2>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-action="refresh"><i class="fa-solid fa-rotate"></i> 刷新</button>
              <button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table user-table table-actions-sticky">
              <thead>
                <tr>
                  <th>时间</th><th>电子屏</th><th>触发类别</th><th>动作</th><th>方式</th>
                  <th>结果</th><th>关联检出</th><th class="user-actions-col">操作</th>
                </tr>
              </thead>
              <tbody id="spContentBody"></tbody>
            </table>
          </div>
          <div class="pagination" id="spContentPager"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="../../../app/config/menu.js"></script>
  <script src="../../../app/components/sidebar.js"></script>
  <script src="../../../app/components/header.js"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/data/screen-protect-mock.js"></script>
  <script>
    const SP = window.ScreenProtect;
    const esc = (v) => String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const dash = (v) => (v == null || v === "" ? "-" : esc(v));
    let filtered = [];
    let currentPage = 1;
    const pageSize = 10;

    function tagHtml(meta) {
      if (!meta || !meta.label) return `<span>-</span>`;
      const cls = meta.tagClass ? `tag ${meta.tagClass}` : "tag";
      return `<span class="${cls}">${esc(meta.label)}</span>`;
    }
    function infoItem(label, value) {
      return `<div class="info-item"><span class="info-label">${label}</span><span class="info-value">${value}</span></div>`;
    }
    function readFilter() {
      return Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((el) => [el.dataset.filter, el.value.trim()]));
    }
    function fillScreens() {
      const opts = SP.listScreens().map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
      const sel = document.querySelector("[data-filter='screenId']");
      if (sel) sel.innerHTML = '<option value="">全部</option>' + opts;
    }
    function refreshMetrics() {
      const m = SP.contentMetrics();
      document.querySelectorAll("#spContentMetrics [data-m]").forEach((el) => { el.textContent = m[el.dataset.m] ?? 0; });
    }
    function renderPager(total) {
      const pages = Math.max(1, Math.ceil(total / pageSize));
      currentPage = Math.min(currentPage, pages);
      let html = `<span>共 <strong>${total}</strong> 条记录，每页 10 条</span>`;
      html += `<span class="page-item${currentPage === 1 ? " disabled" : ""}" data-page-action="prev">‹</span>`;
      for (let i = 1; i <= pages; i += 1) html += `<span class="page-item${i === currentPage ? " active" : ""}" data-page-number="${i}">${i}</span>`;
      html += `<span class="page-item${currentPage === pages ? " disabled" : ""}" data-page-action="next">›</span>`;
      document.getElementById("spContentPager").innerHTML = html;
    }
    function render() {
      const f = readFilter();
      filtered = SP.listContentActions({
        screenId: f.screenId || undefined,
        result: f.result || undefined,
        mode: f.mode || undefined,
        triggerCategory: f.triggerCategory || undefined,
      });
      renderPager(filtered.length);
      const pageRows = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      document.getElementById("spContentBody").innerHTML = pageRows.map((row) => {
        const confirmBtn = row.result === "pending_confirm"
          ? `<button class="table-action" type="button" data-row="confirm" data-id="${esc(row.id)}">人工确认恢复</button>`
          : "";
        return `<tr>
          <td>${dash(row.time)}</td>
          <td>${esc(SP.screenName(row.screenId))}</td>
          <td>${tagHtml(SP.categoryTag(row.triggerCategory))}</td>
          <td>${tagHtml(SP.actionTag(row.action))}</td>
          <td>${tagHtml(SP.modeTag(row.mode))}</td>
          <td>${tagHtml(SP.resultTag(row.result))}</td>
          <td>${dash(row.detectionId)}</td>
          <td class="user-actions-col">
            <button class="table-action" type="button" data-row="detail" data-id="${esc(row.id)}">详情</button>
            ${confirmBtn}
          </td>
        </tr>`;
      }).join("") || `<tr><td colspan="8" style="text-align:center;color:var(--text-secondary)">暂无数据</td></tr>`;
      refreshMetrics();
    }

    function openDetail(id) {
      const row = SP.getContentAction(id);
      if (!row) return;
      const body = `
        <section class="detail-section">
          <h3 class="detail-title">处置信息</h3>
          <div class="detail-grid user-detail-grid">
            ${infoItem("时间", dash(row.time))}
            ${infoItem("电子屏", esc(SP.screenName(row.screenId)))}
            ${infoItem("触发类别", tagHtml(SP.categoryTag(row.triggerCategory)))}
            ${infoItem("动作", tagHtml(SP.actionTag(row.action)))}
            ${infoItem("方式", tagHtml(SP.modeTag(row.mode)))}
            ${infoItem("结果", tagHtml(SP.resultTag(row.result)))}
            ${infoItem("关联检出", dash(row.detectionId))}
            ${infoItem("切断时间", dash(row.cutAt))}
            ${infoItem("恢复时间", dash(row.restoreAt))}
            ${infoItem("备注信息", "-")}
          </div>
        </section>`;
      window.openAppDrawer({ title: "处置详情", body, footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button>' });
    }

    fillScreens();
    render();

    document.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "search" || action === "refresh") { currentPage = 1; render(); }
      if (action === "reset") {
        document.querySelectorAll("[data-filter]").forEach((el) => { el.value = ""; });
        currentPage = 1;
        render();
      }
      if (action === "export") alert("导出功能为原型演示，当前不会生成真实文件。");

      const rowBtn = event.target.closest("[data-row]");
      if (rowBtn) {
        if (rowBtn.dataset.row === "detail") openDetail(rowBtn.dataset.id);
        if (rowBtn.dataset.row === "confirm") {
          if (!confirm("确认恢复该电子屏原视频流播放？")) return;
          SP.confirmContentRestore(rowBtn.dataset.id);
          render();
        }
      }

      const pageNum = event.target.closest("[data-page-number]");
      if (pageNum) { currentPage = Number(pageNum.dataset.pageNumber); render(); }
      const pageAct = event.target.closest("[data-page-action]")?.dataset.pageAction;
      if (pageAct === "prev" && currentPage > 1) { currentPage -= 1; render(); }
      if (pageAct === "next") {
        const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (currentPage < pages) { currentPage += 1; render(); }
      }
    });
  </script>
</body>
</html>
