<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应急能力管理 - 网络安全运维管理平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/screen-protect.css">
</head>
<body class="sp-page" data-menu-key="screen.emergency" data-page-section="电子屏防护管理" data-page-title="应急能力管理">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="metric-grid" id="spEmergencyMetrics">
          <article class="metric-card"><div class="metric-label">今日告警</div><div class="metric-number" data-m="today">0</div></article>
          <article class="metric-card"><div class="metric-label">阻断中</div><div class="metric-number" data-m="blocking">0</div></article>
          <article class="metric-card"><div class="metric-label">处置中</div><div class="metric-number" data-m="handling">0</div></article>
          <article class="metric-card"><div class="metric-label">已关闭</div><div class="metric-number" data-m="closed">0</div></article>
        </section>

        <section class="card filters">
          <div class="filter-actions">
            <label class="form-field"><span class="form-label">电子屏</span>
              <select class="form-control" data-filter="screenId"><option value="">全部</option></select>
            </label>
            <label class="form-field"><span class="form-label">事件类型</span>
              <select class="form-control" data-filter="eventType">
                <option value="">全部</option>
                <option value="abnormal_play">异常播放</option>
                <option value="tamper">内容篡改</option>
                <option value="unauthorized">未授权操作</option>
                <option value="offline">设备失联</option>
              </select>
            </label>
            <label class="form-field"><span class="form-label">紧急程度</span>
              <select class="form-control" data-filter="severity">
                <option value="">全部</option>
                <option value="critical">特急</option>
                <option value="high">高</option>
                <option value="medium">中</option>
              </select>
            </label>
            <label class="form-field"><span class="form-label">处置状态</span>
              <select class="form-control" data-filter="handleStatus">
                <option value="">全部</option>
                <option value="pending">待响应</option>
                <option value="blocking">阻断中</option>
                <option value="handling">处置中</option>
                <option value="closed">已关闭</option>
              </select>
            </label>
            <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-action="search">搜索</button>
          </div>
        </section>

        <section class="card user-list-card">
          <div class="card-title-row user-toolbar">
            <h2 class="card-title">应急事件</h2>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button>
              <button class="btn btn-primary" type="button" data-action="blackout"><i class="fa-solid fa-ban"></i> 一键应急黑屏</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table user-table table-actions-sticky">
              <thead>
                <tr>
                  <th style="width:40px"><input type="checkbox" id="checkAll"></th>
                  <th>告警时间</th><th>电子屏</th><th>事件类型</th><th>紧急程度</th>
                  <th>阻断状态</th><th>处置状态</th><th>耗时</th><th class="user-actions-col">操作</th>
                </tr>
              </thead>
              <tbody id="spEmergencyBody"></tbody>
            </table>
          </div>
          <div class="pagination" id="spEmergencyPager"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="../../../app/config/menu.js"></script>
  <script src="../../../app/components/sidebar.js"></script>
  <script src="../../../app/components/header.js"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/data/screen-protect-mock.js"></script>
  <script>
    const SP = window.ScreenProtect;
    const esc = (v) => String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const dash = (v) => (v == null || v === "" ? "-" : esc(v));
    let filtered = [];
    let currentPage = 1;
    const pageSize = 10;

    function tagHtml(meta) {
      if (!meta || !meta.label) return `<span>-</span>`;
      const cls = meta.tagClass ? `tag ${meta.tagClass}` : "tag";
      return `<span class="${cls}">${esc(meta.label)}</span>`;
    }
    function infoItem(label, value) {
      return `<div class="info-item"><span class="info-label">${label}</span><span class="info-value">${value}</span></div>`;
    }
    function readFilter() {
      return Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((el) => [el.dataset.filter, el.value.trim()]));
    }
    function fillScreens() {
      const opts = SP.listScreens().map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
      const sel = document.querySelector("[data-filter='screenId']");
      if (sel) sel.innerHTML = '<option value="">全部</option>' + opts;
    }
    function refreshMetrics() {
      const m = SP.emergencyMetrics();
      document.querySelectorAll("#spEmergencyMetrics [data-m]").forEach((el) => { el.textContent = m[el.dataset.m] ?? 0; });
    }
    function selectedScreenIds() {
      return [...document.querySelectorAll("#spEmergencyBody input[data-screen]:checked")].map((el) => el.dataset.screen);
    }
    function renderPager(total) {
      const pages = Math.max(1, Math.ceil(total / pageSize));
      currentPage = Math.min(currentPage, pages);
      let html = `<span>共 <strong>${total}</strong> 条记录，每页 10 条</span>`;
      html += `<span class="page-item${currentPage === 1 ? " disabled" : ""}" data-page-action="prev">‹</span>`;
      for (let i = 1; i <= pages; i += 1) html += `<span class="page-item${i === currentPage ? " active" : ""}" data-page-number="${i}">${i}</span>`;
      html += `<span class="page-item${currentPage === pages ? " disabled" : ""}" data-page-action="next">›</span>`;
      document.getElementById("spEmergencyPager").innerHTML = html;
    }
    function render() {
      const f = readFilter();
      filtered = SP.listEmergencies({
        screenId: f.screenId || undefined,
        eventType: f.eventType || undefined,
        severity: f.severity || undefined,
        handleStatus: f.handleStatus || undefined,
      });
      renderPager(filtered.length);
      const pageRows = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      document.getElementById("spEmergencyBody").innerHTML = pageRows.map((row) => {
        const closeBtn = row.handleStatus !== "closed"
          ? `<button class="table-action" type="button" data-row="close" data-id="${esc(row.id)}">关闭</button>`
          : "";
        const handleBtn = row.handleStatus !== "closed"
          ? `<button class="table-action" type="button" data-row="handle" data-id="${esc(row.id)}">应急处置</button>`
          : "";
        return `<tr>
          <td><input type="checkbox" data-screen="${esc(row.screenId)}" data-id="${esc(row.id)}"></td>
          <td>${dash(row.time)}</td>
          <td>${esc(SP.screenName(row.screenId))}</td>
          <td>${tagHtml(SP.eventTypeTag(row.eventType))}</td>
          <td>${tagHtml(SP.severityTag(row.severity))}</td>
          <td>${tagHtml(SP.blockTag(row.blockStatus))}</td>
          <td>${tagHtml(SP.handleTag(row.handleStatus))}</td>
          <td class="sp-latency">${row.latencyMs != null ? `${row.latencyMs}ms` : "-"}</td>
          <td class="user-actions-col">
            <button class="table-action" type="button" data-row="detail" data-id="${esc(row.id)}">详情</button>
            ${handleBtn}
            ${closeBtn}
          </td>
        </tr>`;
      }).join("") || `<tr><td colspan="9" style="text-align:center;color:var(--text-secondary)">暂无数据</td></tr>`;
      const checkAll = document.getElementById("checkAll");
      if (checkAll) checkAll.checked = false;
      refreshMetrics();
    }

    function openDetail(id) {
      const row = SP.getEmergency(id);
      if (!row) return;
      const body = `
        <section class="detail-section">
          <h3 class="detail-title">应急信息</h3>
          <div class="detail-grid user-detail-grid">
            ${infoItem("告警时间", dash(row.time))}
            ${infoItem("电子屏", esc(SP.screenName(row.screenId)))}
            ${infoItem("事件类型", tagHtml(SP.eventTypeTag(row.eventType)))}
            ${infoItem("紧急程度", tagHtml(SP.severityTag(row.severity)))}
            ${infoItem("阻断状态", tagHtml(SP.blockTag(row.blockStatus)))}
            ${infoItem("处置状态", tagHtml(SP.handleTag(row.handleStatus)))}
            ${infoItem("告警耗时", row.latencyMs != null ? `${row.latencyMs}ms` : "-")}
            ${infoItem("备注", dash(row.remark))}
            ${infoItem("备注信息", "-")}
          </div>
        </section>`;
      window.openAppDrawer({ title: "应急详情", body, footer: '<button class="btn btn-secondary" type="button" data-drawer-close>取消</button>' });
    }

    function openHandle(id) {
      const body = `
        <label class="form-field form-item"><span class="form-label form-required">处置动作</span>
          <select class="form-control" id="emAction">
            <option value="block">阻断播放</option>
            <option value="resume">恢复播放</option>
            <option value="escalate">转人工</option>
          </select>
        </label>
        <label class="form-field form-item"><span class="form-label">备注</span>
          <textarea class="form-control textarea" id="emRemark" placeholder="请输入"></textarea>
        </label>`;
      window.openAppDrawer({
        title: "应急处置",
        body,
        footer: `<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-drawer-submit="handle" data-id="${esc(id)}">确认</button>`,
      });
    }

    fillScreens();
    render();

    document.addEventListener("change", (event) => {
      if (event.target.id === "checkAll") {
        const on = event.target.checked;
        document.querySelectorAll("#spEmergencyBody input[data-screen]").forEach((el) => { el.checked = on; });
      }
    });

    document.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "search") { currentPage = 1; render(); }
      if (action === "reset") {
        document.querySelectorAll("[data-filter]").forEach((el) => { el.value = ""; });
        currentPage = 1;
        render();
      }
      if (action === "export") alert("导出功能为原型演示，当前不会生成真实文件。");
      if (action === "blackout") {
        const ids = selectedScreenIds();
        const unique = [...new Set(ids)];
        const result = unique.length ? SP.emergencyBlackout(unique) : SP.emergencyBlackout();
        alert(`已对 ${result.count} 块电子屏执行应急黑屏（Mock）。`);
        render();
      }

      const rowBtn = event.target.closest("[data-row]");
      if (rowBtn) {
        if (rowBtn.dataset.row === "detail") openDetail(rowBtn.dataset.id);
        if (rowBtn.dataset.row === "handle") openHandle(rowBtn.dataset.id);
        if (rowBtn.dataset.row === "close") {
          if (!confirm("确认关闭该应急事件？")) return;
          SP.closeEmergency(rowBtn.dataset.id);
          render();
        }
      }

      const pageNum = event.target.closest("[data-page-number]");
      if (pageNum) { currentPage = Number(pageNum.dataset.pageNumber); render(); }
      const pageAct = event.target.closest("[data-page-action]")?.dataset.pageAction;
      if (pageAct === "prev" && currentPage > 1) { currentPage -= 1; render(); }
      if (pageAct === "next") {
        const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (currentPage < pages) { currentPage += 1; render(); }
      }

      const submit = event.target.closest("[data-drawer-submit]");
      if (submit?.dataset.drawerSubmit === "handle") {
        SP.handleEmergency(submit.dataset.id, {
          action: document.getElementById("emAction")?.value,
          remark: document.getElementById("emRemark")?.value.trim(),
        });
        window.closeAppDrawer();
        render();
      }
    });
  </script>
</body>
</html>
